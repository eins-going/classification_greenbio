<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>그린바이오산업 특수분류(안)</title>
  <style>
:root{
  color-scheme:light;
  --bg:#f8fafd;
  --surface:#ffffff;
  --surface-2:#f1f3f4;
  --surface-hover:#f8fafd;
  --border:#dfe3e8;
  --border-strong:#c4c7c5;
  --text:#1f1f1f;
  --text-muted:#5f6368;
  --accent:#0b57d0;
  --accent-strong:#0842a0;
  --accent-soft:#e8f0fe;
  --accent-soft-border:#a8c7fa;
  --code-bg:#f1f3f4;
  --shadow:none;
  --radius:8px;
  --tier-dae-ink:#0b57d0;
  --tier-jung-ink:#137333;
  --tier-so-ink:#7b1fa2;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{background:var(--bg);}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Google Sans Text","Google Sans","Roboto",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:14.5px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font:inherit;}
::selection{background:var(--accent-soft);color:var(--text);}

.wrap{max-width:1120px;margin:0 auto;padding:28px 28px 72px;}

header.top{
  display:flex;flex-direction:column;gap:5px;
  margin-bottom:20px;padding:2px 2px 0;
}
header.top .title-row{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;
}
header.top h1{
  font-size:30px;line-height:1.25;margin:0;font-weight:600;letter-spacing:-0.02em;
  text-wrap:balance;color:var(--text);
}
header.top .doc-label{
  font-size:14px;font-weight:500;color:var(--text-muted);
  white-space:nowrap;letter-spacing:-0.01em;
}

nav.tabs{
  display:flex;gap:2px;margin:0 0 24px;padding:0 10px;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  overflow-x:auto;scrollbar-width:none;
}
nav.tabs::-webkit-scrollbar{display:none;}
nav.tabs button{
  appearance:none;border:none;background:none;cursor:pointer;
  min-height:48px;padding:11px 16px;font-size:14px;font-weight:500;color:var(--text-muted);
  border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;
}
nav.tabs button:hover{color:var(--accent);background:var(--surface-hover);}
nav.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px;}

.panel{display:none;}
.panel.active{display:block;}
#panel-status,#panel-method,#panel-download{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:24px 26px;
}

/* ---------- 개발원칙 tab ---------- */
.method-lead{
  font-size:13.5px;line-height:1.7;color:var(--text-muted);
  max-width:84ch;margin:0 0 4px;
}
.method-block{margin:0 0 4px;}
.method-block > ul{margin:8px 0 0;padding-left:18px;}
.method-block li{margin:5px 0;line-height:1.65;font-size:13.5px;}
.method-block li > ul{margin:4px 0 6px;padding-left:17px;}
.method-block li > ul li{color:var(--text-muted);font-size:13px;margin:3px 0;}
.method-block b{font-weight:600;}
.law-box{
  margin:14px 0 6px;padding:16px 18px;max-width:86ch;
  background:var(--accent-soft);border:1px solid var(--accent-soft-border);
  border-radius:var(--radius);
}
.law-box figcaption{
  font-size:11.5px;font-weight:700;letter-spacing:.03em;
  color:var(--accent-strong);margin-bottom:10px;
}
.law-box p{margin:0 0 7px;font-size:13.5px;line-height:1.78;}
.law-box ol{margin:7px 0 4px;padding:0;list-style:none;}
.law-box ol li{
  font-size:13px;line-height:1.72;margin:3px 0;
  padding-left:1.9em;text-indent:-1.9em;
}
.law-sub{
  margin:9px 0 12px 1.9em;padding:11px 14px;
  background:var(--surface);border:1px solid var(--accent-soft-border);
  border-radius:6px;
}
.law-sub p{margin:0 0 6px;font-size:12.5px;line-height:1.72;color:var(--text-muted);}
.law-sub p:last-child{margin-bottom:0;}
.law-sub b{color:var(--text);font-weight:600;}

.ref-table{
  width:100%;border:1px solid var(--border);border-collapse:separate;border-spacing:0;
  border-radius:8px;overflow:hidden;margin:10px 0 4px;background:var(--surface);font-size:13px;
}
.ref-table th,.ref-table td{
  text-align:left;padding:8px 11px;border-bottom:1px solid var(--border);vertical-align:top;
}
.ref-table th{
  background:var(--surface-hover);color:var(--text-muted);font-weight:600;font-size:12px;
}
.ref-table tr:last-child td{border-bottom:none;}
.ref-table td.src{color:var(--text-muted);}

/* ---------- 다운로드 tab ---------- */
.dl-card{
  border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;background:var(--surface-hover);max-width:70ch;
}
.dl-card h3{margin:0 0 4px;font-size:15px;font-weight:600;}
.dl-card p{margin:0 0 14px;font-size:13px;line-height:1.7;color:var(--text-muted);}
.dl-btn{
  appearance:none;border:1px solid var(--accent);border-radius:6px;background:var(--accent);
  color:#fff;font-family:inherit;font-size:13.5px;font-weight:600;
  min-height:40px;padding:9px 18px;cursor:pointer;
}
.dl-btn:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
.dl-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.dl-meta{margin-top:10px;font-size:12px;color:var(--text-muted);}

/* ---------- 현황 tab ---------- */
.section-title{
  font-size:15px;font-weight:600;letter-spacing:0;
  color:#3c4043;margin:32px 0 12px;
}
.section-title:first-child{margin-top:0;}

.ecosystem-map{margin:16px 0 8px;}
.eco-main{
  display:grid;grid-template-columns:minmax(150px,1fr) 30px minmax(360px,2.2fr) 30px minmax(150px,1fr);
  gap:8px;align-items:stretch;
}
.eco-card{
  min-width:0;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;box-shadow:none;
}
.eco-card .role,.eco-support-card .role{
  font-size:10.5px;font-weight:600;letter-spacing:.03em;
  color:var(--text-muted);margin-bottom:6px;
}
.eco-card .name,.eco-support-card .name{
  font-size:13.5px;font-weight:600;text-wrap:balance;line-height:1.4;
}
.eco-arrow{
  align-self:center;justify-self:center;color:#80868b;font-size:18px;
  line-height:1;user-select:none;
}
.eco-core-group{
  min-width:0;border:1px solid var(--accent-soft-border);border-radius:10px;
  padding:10px;background:#f3f7ff;box-shadow:none;
}
.eco-core-title{
  display:flex;align-items:center;gap:7px;margin:0 2px 7px;
  color:var(--accent);font-size:11px;font-weight:600;letter-spacing:.03em;
}
.eco-core-title::before{
  content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);
}
.eco-core-flow{display:grid;grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr);gap:6px;align-items:stretch;}
.eco-core-flow .eco-card{border-color:#d2e3fc;box-shadow:none;}
.eco-support-bridge{
  display:grid;grid-template-columns:repeat(4,1fr);align-items:end;
  height:27px;margin:0 5%;color:var(--accent);font-size:16px;font-weight:800;
}
.eco-support-bridge span{text-align:center;line-height:1;}
.eco-support-card{
  display:grid;grid-template-columns:minmax(180px,.85fr) minmax(0,2.15fr);
  gap:18px;align-items:center;padding:14px 16px;background:var(--surface-hover);
  border:1px solid var(--accent-soft-border);
  border-radius:var(--radius);box-shadow:none;
}
.eco-support-card .role{margin-bottom:3px;}
.eco-support-card .scope{
  color:var(--text-muted);font-size:12.5px;line-height:1.5;
  border-left:1px solid var(--border);padding-left:18px;
}
.dist-table{
  width:100%;border:1px solid var(--border);border-collapse:separate;border-spacing:0;
  border-radius:8px;overflow:hidden;margin:10px 0 4px;background:var(--surface);font-size:13.5px;
}
.dist-table th,.dist-table td{
  text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);
}
.dist-table th{background:var(--surface-hover);color:var(--text-muted);font-weight:600;font-size:12px;letter-spacing:.01em;}
.dist-table tbody tr:hover td{background:var(--surface-hover);}
.dist-table td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;}
.dist-table tr:last-child td{border-bottom:none;font-weight:600;background:var(--surface-hover);}

/* ---------- 분류표 tab ---------- */
.toolbar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  margin-bottom:14px;padding:8px;background:#f2f5f9;
  border:1px solid #d8e0e9;border-radius:10px;
}
.level-controls{
  display:inline-flex;flex-wrap:nowrap;gap:2px;align-items:center;padding:3px;
  background:rgba(255,255,255,.86);border:1px solid #d8e0e9;border-radius:8px;
}
.definition-control{
  display:inline-flex;align-items:center;gap:7px;min-height:36px;
  padding:7px 11px;color:#465568;font-size:12.5px;font-weight:600;
  cursor:pointer;white-space:nowrap;
}
/* 첫 토글만 남은 공간을 밀어내 오른쪽 묶음으로 만든다. */
.definition-control:first-of-type{margin-left:auto;}
.definition-control input{width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer;}
.level-key{
  appearance:none;display:inline-flex;justify-content:center;align-items:center;min-height:32px;padding:6px 14px;
  border:0;border-radius:6px;background:transparent;color:#526173;
  font-family:inherit;font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer;
  transition:background .15s,color .15s,box-shadow .15s;
}
.level-key:hover{background:#e8edf3;color:#24364b;}
.level-key.active{
  background:#345d82;color:#fff;box-shadow:0 1px 2px rgba(31,55,77,.18);
}
.level-key:focus-visible{outline:2px solid #345d82;outline-offset:2px;}

.tree{display:flex;flex-direction:column;gap:8px;}
.node{
  border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
  background:var(--surface);box-shadow:none;
}
.node-dae{--tier-ink:var(--tier-dae-ink);}
.node-jung{--tier-ink:var(--tier-jung-ink);}
.node-so{--tier-ink:var(--tier-so-ink);}
.row{
  display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 12px;
  background:var(--surface);
  transition:background .15s;
}
.node > .row:hover{background:var(--surface-hover);}
.node.expanded > .row,
.node.def-open > .row{border-bottom:1px solid var(--border);}
.node > .kids{display:none;padding:10px 10px 12px 12px;background:var(--surface-hover);}
.node.expanded > .kids{display:flex;flex-direction:column;gap:8px;}
.row .code{
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;
  color:var(--tier-ink);background:var(--code-bg);border:1px solid var(--border);
  border-radius:4px;padding:3px 7px;flex:0 0 auto;font-variant-numeric:tabular-nums;
}
.node-dae > .row .code{font-size:13px;font-weight:600;}
.row .name{
  min-width:0;color:var(--tier-ink);font-family:inherit;font-weight:500;font-size:14px;
  flex:1 1 auto;text-align:left;text-wrap:balance;
}
.node-dae > .row .name{font-size:15px;font-weight:600;}
.btn-node-name{
  appearance:none;border:0;background:transparent;margin:0;padding:3px 2px;
  min-width:0;cursor:pointer;border-radius:4px;
}
.btn-node-name:hover{color:var(--tier-ink);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;}
.btn-node-name:focus-visible,.btn-toggle:focus-visible,.btn-def:focus-visible{
  outline:2px solid var(--tier-ink, var(--accent));outline-offset:2px;
}
.row-actions{
  display:flex;align-items:center;gap:6px;margin-left:auto;flex:0 0 auto;
}
.btn-def{
  appearance:none;border:1px solid var(--border);border-radius:6px;
  min-height:32px;padding:4px 10px;font-size:12px;font-weight:600;background:var(--surface);
  color:var(--tier-ink);cursor:pointer;font-family:inherit;
  transition:background .15s,border-color .15s;
}
.btn-def:hover,.btn-def[aria-expanded="true"]{background:var(--surface-hover);border-color:var(--border-strong);}
.btn-toggle{
  appearance:none;border:0;border-radius:6px;background:transparent;color:var(--tier-ink);
  width:32px;height:32px;padding:0;display:inline-grid;place-items:center;cursor:pointer;
}
.btn-toggle:hover{background:var(--surface-hover);}
.row .chev{
  display:inline-block;font-size:12px;line-height:1;transition:transform .15s;
}
.node.expanded > .row .chev{transform:rotate(90deg);}

.node-detail{display:none;margin:10px 12px;gap:10px;}
.node.def-open > .node-detail{display:flex;flex-wrap:wrap;align-items:flex-start;}
.node-detail > *{flex:1 1 330px;min-width:0;}
.node-detail > *[hidden]{display:none;}
.def-block{
  padding:12px 14px;background:var(--surface-hover);
  border:1px solid var(--border);border-radius:6px;font-size:13px;color:var(--text);
  display:block;
}
.def-block .lbl{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--tier-ink);margin-bottom:3px;}
.def-block .incl{margin-top:9px;}
.def-block .excl{margin-top:9px;color:var(--text-muted);}
.def-block .excl .lbl{color:var(--text-muted);}
.def-block .def-list{margin:2px 0 0;padding-left:17px;}
.def-block .def-list li{margin:3px 0;}

@media (prefers-reduced-motion:reduce){.row .chev{transition:none;}}


@media (max-width:760px){
  .wrap{padding:24px 18px 60px;}
  #panel-status{padding:20px;}
  .eco-main{grid-template-columns:1fr;gap:6px;}
  .eco-main > .eco-arrow,.eco-core-flow > .eco-arrow{
    min-height:20px;transform:rotate(90deg);
  }
  .eco-core-flow{grid-template-columns:1fr;}
  .eco-support-bridge{grid-template-columns:1fr;height:27px;margin:0;}
  .eco-support-bridge span{display:none;}
  .eco-support-bridge span:first-child{display:block;}
  .eco-support-card{grid-template-columns:1fr;gap:5px;}
  .eco-support-card .scope{
    border-left:0;border-top:1px solid var(--border);padding:8px 0 0;
  }
}

@media (max-width:640px){
  .wrap{padding:20px 14px 56px;}
  header.top{margin-bottom:17px;}
  header.top h1{font-size:25px;}
  nav.tabs{margin-bottom:18px;padding:0 6px;}
  nav.tabs button{padding:10px 13px;}
  #panel-status{padding:18px 16px;}
  .toolbar{align-items:flex-start;padding:10px;}
  .level-controls{flex:1;}
  .node > .kids{padding-left:6px;padding-right:4px;}
  .row{gap:7px;padding:9px 8px;align-items:flex-start;}
  .row-actions{gap:4px;}
  .btn-def{padding:4px 7px;}
  .def-block{margin:8px;}
}

@media (max-width:520px){
  .eco-card,.eco-support-card{padding:12px;}
  .row .name{font-size:13.5px;}
  .node-dae > .row .name{font-size:14px;}
}

</style>
</head>
<body>

<div class="wrap">  <header class="top">
    <div class="title-row">
      <h1>그린바이오산업 특수분류(안)</h1>
      <span class="doc-label">&lt; 조승현 자문 의견서(제1차, 2026. 8. 3.) &gt;</span>
    </div>
  </header>

  <nav class="tabs">
    <button data-tab="status" class="active">1. 현황</button>
    <button data-tab="table">2. 분류표</button>
    <button data-tab="method">3. 개발원칙</button>
    <button data-tab="download">4. 다운로드</button>
  </nav>

  <section id="panel-status" class="panel active"></section>
  <section id="panel-table" class="panel"></section>
  <section id="panel-method" class="panel"></section>
  <section id="panel-download" class="panel"></section>

</div>

<script>

다. 그린바이오 관련 계약·매출·전문인력 또는 전용시설을 다른 활동과 구분하여 식별할 수 있는 경우로 한정한다. 물리적 재화의 생산·재판매와 동일 기업 내부에서 수행하는 연구·품질관리 등은 제외한다.","include":["독립·위탁 연구개발과 품종·균주·공정 개발","효능·독성·위해성·품질 시험과 성분·유전체·생물정보 분석","인증·인허가·규제·품질체계 지원","그린바이오 전문교육·훈련, 데이터·정보·소프트웨어 서비스","기술이전·사업화·창업·수출 등 그린바이오 직접지원","기자재의 독립 임대·수리·검증·교정·유지관리","그린바이오 전용 물류·저장 서비스가 별도 사업체의 주활동인 경우"],"exclude":["생산·제조기업 내부 R&D·품질관리·교육 → 해당 주활동의 부수활동","자영 또는 임가공 방식으로 생물자원 자체를 생산하는 증식·배양·사육 → 그린바이오 생물자원 생산업(대분류 2)","자영 또는 임가공 방식으로 물리적 소재·제품을 실제 생산하는 제조·발효 → 그린바이오 제조업(대분류 3)","일반 대학 교육, 일반 법률·회계·금융·광고·운송·창고·IT 서비스","고객 중 그린바이오기업이 일부 있다는 이유만으로 포함되는 범용 서비스"]}],"jung":[{"code":"11","dae":"1","criterion":"기자재를 직접 제조하는 활동","name":"그린바이오 기자재 제조업","def":"생명공학 관련 기술이 적용되는 종자·미생물·곤충·천연물·식품 제조용 원재료·동물용 의약품의 연구·생산·제조에 직접 사용되며, 그 용도로 전용되거나 주로 사용되거나 해당 공정의 품질·안전 요건에 맞게 실질적으로 특화된 자재, 연구·분석장비 또는 생산·공정장비를 직접 제조하는 산업활동을 말한다. 자체 제조한 기자재의 판매는 제조업에 포함한다.","include":["배지·시약·효소·공정재","유전·세포·성분·품질 분석장비","배양·발효·분리·정제·건조·제형·환경제어장비의 제조"],"exclude":["타사 제품의 매입·수입·재판매, 범용 실험소모품·컴퓨터·계측기, 장비 임대·수리·교정 서비스"]},{"code":"12","dae":"1","criterion":"타사 제조 기자재의 매입·수입·재판매","name":"그린바이오 기자재 도매업","def":"생명공학 관련 기술이 적용되는 종자·미생물·곤충·천연물·식품 제조용 원재료·동물용 의약품의 연구·생산·제조에 전용되거나 주로 사용되도록 특화된 자재, 연구·분석장비 또는 생산·공정장비로서 타사가 제조한 것을 매입하거나 수입하여 사업체·연구기관·생산자에게 본질적으로 변형하지 않고 재판매하는 산업활동을 말한다. 관련 품목·계약·매출을 일반 기자재와 분리할 수 있어야 한다.","include":["외국산 특화 배지·시약·장비의 수입·도매","국내 타사 제조 기자재의 전문 도매"],"exclude":["자체 제조 기자재의 판매, 최종소비자 대상 소매, 범용 기자재의 종합도매"]},{"code":"21","dae":"2","criterion":"품종·종자·종묘 및 소재 원료용 식물 생산","name":"그린바이오 식물자원 생산업","def":"생명공학 관련 기술을 적용하여 식물 품종과 증식 기반자원을 개발·생산하거나 종자·종묘를 증식·생산하고, 그린바이오 소재·제품의 원료로 사용하는 식물체 또는 수확물을 재배·생산하는 산업활동을 말한다. 번식용 자원과 소재 원료용 수확물은 소분류와 공급용도 속성으로 구분한다."},{"code":"22","dae":"2","criterion":"곤충자원 자체의 사육·증식","name":"그린바이오 곤충자원 생산업","def":"생명공학 관련 기술을 적용해 산업용 곤충(「곤충산업의 육성 및 지원에 관한 법률」상 곤충, 즉 분류학상 곤충강에 속하는 동물과 거미류·지네류 등 같은 법이 정하는 무척추동물)의 계통·품종을 선발·개량하고 종충·종란을 생산하거나 식품·사료·방제·소재용 곤충을 증식·사육하는 산업활동을 말한다."},{"code":"23","dae":"2","criterion":"미생물·균주·세포 자체의 배양·증식","name":"그린바이오 미생물 및 세포·조직자원 생산업","def":"그린바이오 분야에 이용할 미생물·종균·균주·세포·조직자원을 생명공학 관련 기술로 발굴·제작·배양·증식하여 자원 자체로 생산하는 산업활동을 말한다. 가축의 번식과 품종개량에 사용하는 정액·난자·수정란·배아를 채취·처리·보존하여 생산하는 활동은 제외한다."},{"code":"31","dae":"3","criterion":"농작물·토양·재배환경에 투입되는 기능성 제품","name":"그린바이오 작물재배용 제품 제조업","def":"그린바이오 생물자원 또는 생명공학 관련 기술·생물공정을 직접 이용하여 농작물에 피해를 주는 균·곤충·응애·선충·바이러스·잡초 등의 병해충을 방제하거나 농작물의 생리기능을 증진·억제하는 제품, 또는 식물에 영양을 공급하고 재배를 돕거나 토양을 개량하는 제품을 제조하는 산업활동을 말한다.","include":["바이오농약","미생물비료","생물촉진제","천적·페로몬 기반 방제제품"],"exclude":["종자·종묘·미생물·균주·세포·곤충·기능성 식물자원 자체의 생산, 생명공학·생물공정 직접성이 없는 화학농약·일반 유기질비료, 연구·생산공정에 투입되는 배지·시약 등 자재의 공급"]},{"code":"32","dae":"3","criterion":"가축·반려동물용 사료·첨가제","name":"그린바이오 사료·사료첨가제 제조업","def":"그린바이오 생물자원 또는 생명공학 관련 기술·발효·효소 등 생물공정을 직접 이용하여 동물의 영양·건강유지·성장에 필요한 제품을 제조하는 산업활동을 말한다. 식물성·동물성·광물성 물질을 그대로 사료나 배합원료로 사용하는 단미사료, 단미사료와 보조사료 등을 적정한 비율로 배합·가공한 배합사료, 사료의 품질저하를 방지하거나 효용을 높이기 위해 첨가하는 보조사료를 포함한다.","include":["발효사료","곤충사료","생균제·효소제·아미노산 등 생물기반 사료첨가제"],"exclude":["생명공학·생물공정 직접성이 없는 일반 배합사료, 사람이 섭취하는 식품원료·식품의 제조, 동물 질병의 진단·치료·예방 등을 목적으로 하는 동물용 의약품의 제조"]},{"code":"33","dae":"3","criterion":"식품 제조용 소재와 식용 제품","name":"그린바이오 식품원료·식품 제조업","def":"농업에 실제적이거나 잠재적인 가치가 있는 동물·식물·미생물 등 생물체와 그 실물에서 파악한 유용한 정보, 산업적으로 이용되는 곤충 또는 육상·해양 생물체와 그 세포·조직배양 산물 등 생물기원 천연물을 직접 이용하거나 생명공학 관련 기술·생물공정을 직접 적용하여 식품 제조용으로 분말·액상 등 별도 형태로 가공된 원재료·중간생산물, 식품첨가물 또는 기능성 원료를 제조하는 산업활동을 말한다. 식용 완제품은 농업에 실제적·잠재적 가치가 있는 미생물, 산업적으로 이용되는 곤충 또는 육상·해양 동식물과 그 세포·조직배양 산물 등 생물기원 천연물을 원료나 공정에 이용하고, 생명공학 관련 기술·생물공정이 제품의 특성이나 제조공정에 직접 기여하는 경우에만 조건부로 포함한다. 다른 식품의 제조에 투입되는 중간투입물과 소비자가 그대로 섭취하는 식용 완제품으로 나누어 하위 분류한다. 중간투입물은 최종식품의 구성 성분을 이루는 원재료·중간생산물과 기술적 효과를 위해 소량 쓰는 첨가물·효소를 **하나의 소분류(331)로 묶는다** — 「식품등의 표시기준」이 첨가물을 원재료명에 함께 적도록 하고 있어 거래 현장에서 두 갈래가 분리되지 않기 때문이다. 다만 「식품위생법 시행령」 제21조는 식품제조·가공업과 식품첨가물제조업을 별개 영업으로 두므로, 조사표에서 영업 종류와 품목별 매출을 함께 받아 사후에 분리할 수 있게 한다. 식용 완제품 쪽은 **제도적 지위를 먼저 보고 공정을 나중에 본다.** 「건강기능식품에 관한 법률」의 건강기능식품 인정을 받았으면 건강기능식품, 「식품의 기준 및 규격」의 특수영양식품 또는 특수의료용도식품에 해당하면 특수영양·특수의료용도식품으로 가른다. 제도적 지위가 없는 완제품은 특정 미생물·스타터와 제어발효공정이 기여하면 발효식품, 세포배양·정밀발효로 축산물 등을 대체하면 대체식품, 어느 것에도 해당하지 않으면 기타 식품으로 분류한다.","include":["식품원료·중간소재","식품용 효소·첨가물","발효식품","건강기능식품","특수영양·특수의료용도식품","대체식품","곤충식품 등 기타 식용 완제품"],"exclude":["생명공학·생물공정 직접성이 없는 일반 가공식품, 동물의 영양·건강·성장에 사용하는 사료·사료첨가제, 향장·산업용 등 비식용 천연물 소재·제품"]},{"code":"34","dae":"3","criterion":"동물용 백신·진단제 등 생물학적 제제","name":"그린바이오 동물용 의약품 제조업","def":"기구·기계·장치가 아닌 물품 중 동물용으로만 사용할 목적으로 생명공학 관련 기술이나 생물체·생물유래 물질을 이용하여 동물의 질병을 진단·치료·경감·처치·예방하거나 동물의 구조·기능에 약리학적 영향을 주는 백신 등 생물학적 제제, 진단제와 그 원료를 제조하는 산업활동을 말한다.","include":["동물용 백신·항체·재조합 단백질 의약품·생물학적 진단제"],"exclude":["비바이오 합성 동물용 의약품, 동물의 영양·건강·성장에 사용하는 사료·사료첨가제·영양제, 동물을 직접 진료하는 수의 서비스와 외부 고객에게 제공하는 의약품 시험·분석 서비스"]},{"code":"39","dae":"3","criterion":"비식용 중간소재와 향장·생활용·산업용 완제품","name":"기타 그린바이오 제품 제조업","def":"그린바이오 생물자원 또는 생명공학 관련 기술·생물공정을 직접 이용하여 향장·생활용 소재·제품이나 비식용·비사료용 산업 소재·제품을 제조하는 산업활동을 말한다. 작물재배용 제품, 사료·사료첨가제, 식품원료·식품 및 동물용 의약품은 제외한다. 생물기원·천연·친환경이라는 표시만으로 포함하지 않는다. 하위 분류는 **중간소재와 완제품**으로 가른다. 다른 제조업체에 공급되는 비식용 중간소재는 `391`, 소비자·수요처가 그대로 쓰는 완제품은 향장·생활용이면 `392`, 그 밖의 산업용이면 `399`다. 천연물·곤충·미생물은 원료 속성으로 기록하고 분류축으로 쓰지 않는다.","include":["추출물·오일·단백질·대사산물·효소 등 비식용 중간소재","향장소재를 이용한 화장품·생활제품","그 밖의 산업용 완제품"],"exclude":["바이오연료·범용 바이오화학 등 그린바이오 직접성이 없는 화이트바이오 제품"]},{"code":"41","dae":"4","criterion":"사업자 대상 자기 계정 매입·재판매","name":"그린바이오 생물자원·제품 도매업","def":"타사가 생산·제조한 다음의 그린바이오 생물자원·소재·제품을 구입하여 소매업자·산업사용자·기관 등에 재판매하거나 그 거래를 중개하는 산업활동을 말한다. 그 대상은 생명공학 관련 기술을 적용해 개발·육종·증식·배양·사육했거나 확인된 그린바이오 공정의 규격·계약에 따라 생산한 종자·종묘·미생물·균주·세포·곤충·기능성 식물자원과, 그린바이오 생물자원 또는 생명공학 관련 기술·생물공정을 직접 이용해 제조한 작물재배용 제품·사료·식품원료·식품·동물용 의약품·비식용 소재·제품이다. 해당 품목과 매출을 일반 상품과 구분하여 식별할 수 있는 경우로 한정한다.","include":["생명공학 관련 기술을 적용하거나 확인된 그린바이오 공정의 규격·계약에 따라 생산하고","해당 기술·공정의 직접 기여와 품목·매출을 분리 확인할 수 있는 타사 종자·종묘·균주·세포·곤충·기능성 식물원물·바이오농약·미생물비료·생물기반 사료·식품소재·동물용 바이오의약품·향장소재 등의 사업자·기관 대상 재판매"],"exclude":["그린바이오 직접성을 확인할 수 없는 일반 종자·식품·화장품·동물용의약품 도매, 자기 생산물 판매, 그린바이오 연구·생산용 배지·시약·분석장비·공정장비의 도매"]},{"code":"42","dae":"4","criterion":"최종 수요자 대상 판매","name":"그린바이오 생물자원·제품 소매업","def":"타사가 생산·제조한 다음의 그린바이오 생물자원·소재·제품을 일반소비자 또는 최종 수요자에게 판매하는 산업활동을 말한다. 전문점·전자상거래를 통한 판매를 포함한다. 그 대상은 생명공학 관련 기술을 적용해 개발·육종·증식·배양·사육했거나 확인된 그린바이오 공정의 규격·계약에 따라 생산한 종자·종묘·미생물·균주·세포·곤충·기능성 식물자원과, 그린바이오 생물자원 또는 생명공학 관련 기술·생물공정을 직접 이용해 제조한 작물재배용 제품·사료·식품원료·식품·동물용 의약품·비식용 소재·제품이다. 해당 품목과 매출을 일반 상품과 구분하여 식별할 수 있는 경우로 한정한다.","include":["생명공학 관련 기술을 적용하거나 확인된 그린바이오 공정의 규격·계약에 따라 생산하고","해당 기술·공정의 직접 기여와 품목·매출을 분리 확인할 수 있는 타사 종자·종묘·곤충·기능성 식물원물·식품·동물용 바이오의약품·화장품 등의 일반소비자·최종 수요자 대상 전문점·전자상거래 판매"],"exclude":["그린바이오 직접성을 확인할 수 없는 일반 원예·애완곤충·식품·화장품 종합소매, 자기 생산물 판매, 그린바이오 연구·생산용 배지·시약·분석장비·공정장비의 소매"]},{"code":"51","dae":"5","criterion":"외부 고객 대상 연구·품종·균주·공정 개발","name":"그린바이오 연구개발 서비스업","def":"수수료 또는 계약에 따라 외부 고객에게 생명공학 관련 기술·생물공정이 직접 적용되는 종자·종묘·미생물·균주·세포·곤충·천연물·식품 제조용 원재료·동물용 의약품·그 밖의 소재·제품이나 그 생산공정에 관한 연구개발·설계 결과를 제공하는 산업활동을 말한다. 대상 기술·재화·공정과 계약·매출을 일반 연구개발과 구분할 수 있어야 한다. 계약 명칭과 관계없이 생물자원 자체를 증식·생산하는 위탁활동은 생물자원 생산업으로, 원재료를 가공하여 물리적 소재·제품을 실제 산출하는 위탁활동은 제조업으로 분류한다.","include":["생명공학 관련 기술·생물공정이 직접 적용되는 종자·균주·세포·소재·제품·공정에 관한 외부 연구개발 계약 중 대상 프로젝트·계약·매출을 일반 연구개발과 분리할 수 있는 활동"],"exclude":["사람 의료·일반 생명과학 R&D, 자체 제품개발, 실제 재화를 산출하는 위탁생산"]},{"code":"52","dae":"5","criterion":"생물정보·데이터·전문 소프트웨어","name":"그린바이오 정보·데이터 서비스업","def":"생명공학 관련 기술이 적용되는 종자·미생물·곤충·천연물·식품 제조용 원재료·동물용 의약품의 연구·생산·제조에 직접 사용되는 생물정보 데이터베이스, 데이터 처리·해석, 전문 소프트웨어와 디지털 플랫폼을 외부 이용자에게 제공하는 산업활동을 말한다. 특정 시료·프로젝트의 분석보고서가 주된 산출물이면 시험·인증 서비스로 분류하며, 범용 IT·스마트농업 서비스는 제외한다.","include":["종자·미생물·곤충·천연물·식품소재·동물용 의약품 또는 이들의 생산·제조에 직접 적용되는 생명공학·생물공정 데이터에 특화되고","이용대상·계약·매출을 일반 정보서비스와 분리할 수 있는 지속형 데이터베이스·정보·소프트웨어·플랫폼"],"exclude":["사람 의료·일반 바이오 데이터베이스, 범용 ERP·클라우드·스마트농업 플랫폼, 특정 시료·프로젝트에 대한 개별 시험·분석보고서"]},{"code":"53","dae":"5","criterion":"외부 대상 전문인력 교육·훈련","name":"그린바이오 교육 서비스업","def":"외부 이용자를 대상으로 종자·미생물·곤충·천연물·식품 제조용 원재료·동물용 의약품에 적용되는 생명공학 관련 기술과 그 생산·제조공정, 품질·안전·규제와 사업화에 관한 전문 교육·실습·훈련을 제공하는 산업활동을 말한다. 일반 정규교육과 제품판매에 부수되는 사용설명은 제외한다.","include":["종자·미생물·곤충·천연물·식품소재·동물용 의약품 및 관련 생명공학·생물공정의 생산·품질·규제·사업화에 관한 외부 유상 교육·훈련 중 교육대상·계약·매출을 일반 교육과 분리할 수 있는 활동"],"exclude":["일반 바이오·경영·정규교육, 자사 직원훈련, 제품판매에 부수되는 사용설명, 특정 기업의 인허가·기술이전·창업·수출·경영 자문"]},{"code":"54","dae":"5","criterion":"시험·검사·분석·평가·인증 지원","name":"그린바이오 관련 시험·인증 서비스업","def":"외부 고객의 그린바이오 생물자원·소재·제품에 대해 효능·독성·위해성·품질 시험, 유전체·성분·생물정보 분석, 검사·검증 또는 인증을 제공하는 산업활동을 말한다. 인증 취득을 위한 자문만 제공하는 활동은 시험·인증 서비스가 아니라 사업화·전문지원 서비스로 분류한다.","include":["생명공학 관련 기술이 적용되었거나 확인된 그린바이오 공정의 규격·계약에 따라 생산된 종자·미생물·곤충·천연물·식품소재·동물용 의약품과 관련 공정의 시험·분석·검사·인증 중 대상 프로젝트·계약·매출을 일반 시험과 분리할 수 있는 활동"],"exclude":["일반 의약·식품·환경 시험, 내부 품질관리, 시설·장비 자체의 검증·교정 서비스, 인증 취득을 위한 준비·인허가 자문"]},{"code":"59","dae":"5","criterion":"인허가·사업화 지원, 시설·장비 활용, 전문물류·운영지원","name":"기타 그린바이오 관련 서비스업","def":"그린바이오 생물자원이나 생명공학 관련 기술·생물공정이 제품기능 또는 제조공정에 직접 기여하는 재화의 사업화와 생산활동을 지원하는 서비스 중, 연구개발(`51`)·시험·인증(`54`)·정보데이터(`53`)·교육(`53`)에 해당하지 않는 것을 수수료·계약에 따라 외부 고객에게 제공하는 산업활동을 말한다. 인허가·규제 대응과 품질·안전·인증체계 구축 자문, 기술이전·지식재산·창업·투자유치·수출 지원, 전용·특화 시설·장비의 임대·공동활용·유지관리·수리·검증·교정, 생물학적 품질·안전·저온·추적성이 요구되는 전문 물류·보관과 시설·공정 운영지원의 네 갈래를 포함한다. 연구개발(`51`), 시험·인증(`54`), 정보·데이터(`52`), 교육(`53`)의 정의에 해당하면 그 코드를 우선하고, 어느 것에도 해당하지 않는 지원서비스만 이 중분류로 분류한다.","include":["특정 그린바이오 제품·기술의 인허가·품질체계·기술이전·사업화 계약","전용·특화 시설·장비의 임대·공동활용·유지관리","생물학적 요건에 특화된 물류·보관·운영지원 중 계약·매출을 일반 서비스와 분리할 수 있는 활동"],"exclude":["시험·검사·검증·심사 결과를 발급하는 서비스, 조직적 교육, 시설·장비의 판매와 부수 설치, 상품 매매와 CMO·CDMO, 그린바이오 계약·전담역량·매출을 분리하지 못하는 일반 RA·ISO·창업·광고·법률·회계·금융 지원과 일반 장비수리·임대·냉장물류·공장운영"]}],"so":[{"code":"110","jung":"11","name":"그린바이오 기자재 제조업","def":"생명공학 관련 기술이 적용되는 종자·미생물·곤충·천연물·식품 제조용 원재료·동물용 의약품의 연구·생산·제조에 전용되거나 주로 사용되도록 특화된 기자재를 직접 제조하는 산업활동을 말한다. 배지·배양기질·시약·효소·완충용액·시약키트·유전자 벡터·담체·공정재 등 소모성 자재, 유전·세포·생물정보 또는 성분·품질·안전을 시험·측정·분석하는 연구·분석장비와 그 전용 부품, 배양·발효·분리·정제·건조·제형 장비와 생물자원의 증식·사육·재배 환경제어 장비 등 생산·공정장비를 포함한다. 자체 제조한 기자재의 판매는 이 산업활동에 포함한다.","exclude":"그 연구·생산·제조 공정에 대한 전용·주사용·특화를 증빙할 수 없는 범용 실험소모품·계측기·펌프·탱크·공정기계의 제조와 사람 의료 전용 장비의 제조는 제외한다. 타사가 제조한 기자재의 매입·수입·재판매, 장비를 이용해 외부 고객에게 분석결과를 제공하는 용역과 장비의 임대·유지관리 서비스도 제외한다."},{"code":"120","jung":"12","name":"그린바이오 기자재 도매업","def":"생명공학 관련 기술이 적용되는 종자·미생물·곤충·천연물·식품 제조용 원재료·동물용 의약품의 연구·생산·제조에 전용되거나 주로 사용되도록 특화된 타사 제조 기자재를 매입하거나 수입하여, 본질적으로 변형하지 않고 사업자·연구기관·생산자에게 재판매하며 해당 품목·매출을 일반 기자재와 분리하는 산업활동을 말한다. 배지·시약·효소·시약키트·담체·공정재 등 소모성 자재, 유전·세포·생물정보와 성분·품질·안전을 시험·측정·분석하는 연구·분석장비, 배양·발효·분리·정제·건조·제형 장비와 생물자원 증식·사육·재배 환경제어 장비 등 생산·공정장비를 포함한다.","exclude":"자체 제조한 기자재의 판매, 전용·주사용·특화를 증빙할 수 없는 범용 소모품·계측기·공정기계의 도매, 사람 의료 전용 장비의 도매와 최종소비자 대상 소매는 제외한다. 장비를 이용해 외부 고객에게 분석결과를 제공하는 용역과 장비의 임대·유지관리 서비스도 제외한다."},{"code":"211","jung":"21","name":"그린바이오 종자·종묘 생산업","def":"생명공학 관련 육종·유전체·선발·편집 기술을 적용하여 식물 품종을 개발하거나 해당 품종의 원원종·원종·모본·부본·보급종·판매용 종자·묘목·묘종·조직배양묘를 생산·증식하는 산업활동을 말한다.","exclude":"외부 고객에게 연구개발 결과만 제공하는 활동, 기술 적용이 확인되지 않는 일반 품종·종자·종묘 생산과 소재 원료 수확 목적의 식물재배는 제외한다. 「종자산업법」상 종자에 포함되는 버섯 종균 등 균류의 종자원 생산도 제외한다."},{"code":"212","jung":"21","name":"그린바이오 소재 원료용 식물 생산업","def":"유용성분·기능성 형질의 탐색·선발·개량 또는 생산관리에 생명공학 관련 기술을 적용하거나, 확인된 그린바이오 소재·제품 제조공정의 성분·품질규격 또는 계약에 따라, 그 원료로 사용하는 식물체 또는 수확물을 재배·생산하는 산업활동을 말한다. 노지·시설·수경·식물공장 등 재배방식은 묻지 않으며, 수확물이 실제로 그린바이오 소재·제품의 원료로 공급되는 관계가 확인되어야 한다.","exclude":"원료 공급관계와 생명공학 관련 기술 적용이 모두 확인되지 않는 일반 식용·약용 작물재배와, 수확물을 분쇄·농축·추출·정제하여 별도 소재로 제조하는 활동은 제외한다."},{"code":"220","jung":"22","name":"그린바이오 곤충자원 생산업","def":"생명공학 관련 기술을 적용해 「곤충산업의 육성 및 지원에 관한 법률」상 곤충, 즉 분류학상 곤충강에 속하는 동물과 거미류·지네류 등 같은 법이 정하는 무척추동물(사슴벌레·동애등에·뒤영벌·천적 응애 등)의 계통·품종을 선발·개량하여 종충·종란 등 증식 기반자원을 생산하거나, 식품·사료·방제·소재용 곤충을 증식·사육하는 산업활동을 말한다. 확인된 그린바이오 제조규격에 따른 계약 사육을 포함한다. 번식 기반자원 생산과 산업용 사육은 공급용도 속성으로 구분한다.","exclude":"일반 애완·관상곤충의 생산·판매와 생명공학 관련 기술 또는 확인된 그린바이오 제조규격과 관계없는 일반 곤충사육은 제외한다. 곤충을 분말·오일·추출물 등으로 가공하는 활동과 체험·교육 서비스도 제외한다."},{"code":"231","jung":"23","name":"그린바이오 미생물자원 생산업","def":"농업에 실제적이거나 잠재적인 가치가 있는 미생물의 종균·스타터·균주 자체를 생명공학 관련 기술로 발굴·제작·배양·증식하여 그린바이오 연구·생산에 공급하는 산업활동을 말한다. 농업·식품·사료·소재 분야에 이용하는 세균·효모·곰팡이·미세조류 등을 포함하며, 그 농업적 가치는 적용 분야와 용도로 확인한다.","exclude":"미생물 대사산물·효소·제형 미생물제제의 제조와, 농업에 대한 실제적·잠재적 가치가 확인되지 않는 사람 의료·환경·에너지용 균주의 생산은 제외한다. 버섯 재배용 종균의 증식·생산과 식물·동물·곤충의 세포·조직자원 생산도 제외한다."},{"code":"232","jung":"23","name":"그린바이오 세포·조직자원 생산업","def":"종자, 농업에 실제적이거나 잠재적인 가치가 있는 미생물, 산업적으로 이용되는 곤충 또는 생물기원 천연물의 원천이 되는 육상·해양 생물체에서 유래한 세포·조직·세포주 자원 자체를 생명공학 관련 기술로 제작·배양·증식하여 그린바이오 연구·생산에 공급하는 산업활동을 말한다. 자원의 원천 생물체가 위 관련 분야에 해당함을 확인할 수 있어야 한다.","exclude":"가축의 번식과 품종개량에 사용하는 정액·난자·수정란·배아의 채취·처리·보존은 제외한다. 이는 농업생명자원에는 해당하나 법이 정한 관련 분야에 열거되지 않기 때문이다. 재배용 완성 묘, 사람 치료용 세포자원과 세포 기반 완제품의 제조도 제외한다."},{"code":"311","jung":"31","name":"생물농약·생물방제제품 제조업","def":"병해충 방제 또는 농작물 생리기능 조절에 사용하는 농약·방제제품 중, 농업에 실제적이거나 잠재적인 가치가 있는 미생물, 분류학상 곤충강에 속하는 동물과 거미류·지네류 등 「곤충산업의 육성 및 지원에 관한 법률」이 곤충으로 정하는 무척추동물(사슴벌레·동애등에·뒤영벌·천적 응애 등) 중 농업·식품·사료·소재 분야에서 산업적으로 이용되는 것, 육상·해양 생물체와 그 세포·조직배양 산물 등 생물기원 천연물 또는 생명공학 관련 기술·생물공정을 유효성분이나 방제기능에 직접 이용하여 제조하는 산업활동을 말한다. 살아 있는 미생물 또는 자연계 생성 화합물을 유효성분으로 하는 천연식물보호제도 이러한 생물자원과 연결되고 생명공학 관련 기술·생물공정의 직접 기여가 함께 확인되면 포함한다.","exclude":"살아 있는 천적곤충을 원형 그대로 증식·사육하는 활동은 제외한다. 천연식물보호제라는 명칭만 있거나 생물유래 표시만 있는 제품 및 화학농약 제조도 제외한다."},{"code":"312","jung":"31","name":"그린바이오 비료 제조업","def":"미생물·식물·해조류 등 그린바이오 생물자원 또는 발효·효소처리·생물전환 등의 생물공정을 이용하여 식물에 양분을 공급하거나 토양의 물리적·화학적·생물학적 특성을 개선하는 비료를 제조하는 산업활동을 말한다. 유용 미생물, 미생물 배양물·대사산물, 발효 아미노산·유기산 및 생물전환 양분 소재를 이용한 비료를 포함한다.","exclude":"그린바이오 생물자원·생물공정의 직접 기여가 없는 일반 퇴비·유기질비료·화학비료, 비료에 해당하지 않는 생물촉진제와 제형하지 않은 미생물·종균·균주 자체의 생산은 제외한다."},{"code":"319","jung":"31","name":"기타 그린바이오 작물재배용 제품 제조업","def":"그린바이오 생물자원 또는 생명공학 관련 기술·생물공정을 직접 이용하여 작물 생육·활력·스트레스 저항성 또는 재배환경을 개선하면서도, 병해충 방제·농작물 생리기능 조절에 사용하는 농약·방제제품이나 식물 영양 공급·재배 보조·토양개량에 사용하는 비료에는 해당하지 않는 생물촉진제·생물제제를 제조하는 산업활동을 말한다.","exclude":"제품 기능이 병해충 방제·농작물 생리기능 조절을 목적으로 하는 농약·방제제품이거나 식물 영양 공급·재배 보조·토양개량을 목적으로 하는 비료에 해당하는 경우는 제외한다. 그린바이오 직접성이 없는 일반 농자재·단순 영양제·근거 없는 친환경 제품도 제외한다."},{"code":"321","jung":"32","name":"그린바이오 사료 제조업","def":"동물의 영양·건강유지·성장에 필요한 단미사료·배합사료 중, 그린바이오 미생물·곤충·천연물 또는 생명공학 관련 발효·효소·생물전환 공정이 영양·기능·안전성에 실질적으로 기여하도록 제조하는 산업활동을 말한다.","exclude":"원료명만 생물유래이고 그린바이오 생물자원이나 생명공학 관련 공정의 직접 기여가 없는 일반 배합·단미사료와 사람용 식품의 제조는 제외한다."},{"code":"322","jung":"32","name":"그린바이오 사료첨가제 제조업","def":"사료의 품질저하를 방지하거나 효용을 높이기 위해 첨가하는 보조사료 중, 생명공학 관련 기술·생물공정으로 생산한 생균제·효소제·아미노산·발효대사산물 등을 제조하는 산업활동을 말한다.","exclude":"생명공학 관련 기술·생물공정의 직접 기여가 없는 화학합성 첨가제, 동물 질병의 예방·진단·치료를 목적으로 하는 동물용 의약품과 제형하지 않은 미생물·종균·균주 자체의 생산은 제외한다."},{"code":"331","jung":"33","name":"그린바이오 식품원료·첨가물 제조업","def":"식품의 제조에 투입되는 원재료·중간생산물과, 식품을 제조·가공·조리 또는 보존하는 과정에서 감미·착색·표백·산화방지 등의 기술적 효과를 내기 위해 소량 사용하는 첨가물 및 발효·가공보조용 효소로서, 그린바이오 미생물·곤충·천연물 등 생물자원 또는 생명공학 관련 기술·생물공정을 직접 이용하여 제조하는 산업활동을 말한다. 최종식품에 배합되어 그 구성 성분을 이루도록 분말·액상 등 별도 형태로 가공한 원료·중간소재와, 기술적 효과를 목적으로 소량 사용하는 첨가물·효소를 함께 포함한다. 두 갈래는 배합목적과 사용량으로 구분한다.","exclude":"소비자가 그대로 섭취하는 발효식품·건강기능식품·특수영양식품·특수의료용도식품·대체식품 등 식용 완제품의 제조는 제외한다. 식품 제조가 아닌 그린바이오 연구·분석·생산공정에 투입하는 공정효소의 공급, 사료의 효용을 높이기 위한 사료첨가제의 제조, 첨가물로 제형하지 않은 미생물·종균·스타터 배양물 자체의 생산도 제외한다. 비식용·비사료용 산업소재의 제조와 생물학적 원형을 유지한 식물·미생물·곤충자원의 생산, 화학합성 첨가물 및 그린바이오 직접성이 없는 일반 원료·첨가물의 제조도 제외한다."},{"code":"332","jung":"33","name":"그린바이오 발효식품 제조업","def":"농업에 실제적이거나 잠재적인 가치가 있는 특정 미생물·스타터와 문서화된 생명공학 관련 제어발효공정이 품질·기능에 실질적으로 기여하도록 식품·음료 완제품을 제조하는 산업활동을 말한다.","exclude":"김치·장류·주류 등 전통·통상 발효식품은 특정 미생물·스타터의 사용과 문서화된 제어발효공정의 직접 기여가 확인되지 않으면 제외한다. 발효가 아닌 방식으로 미생물을 이용한 식품은 기타 그린바이오 식품 제조업으로 옮긴다. 식품으로 제형하지 않은 미생물·종균·스타터 자체의 생산과 그린바이오 직접성이 없는 일반 가공식품의 제조도 제외한다."},{"code":"333","jung":"33","name":"그린바이오 건강기능식품 제조업","def":"인체에 유용한 기능성을 가진 원료나 성분을 사용하여 제조·가공한 식품으로서 「건강기능식품에 관한 법률」에 따라 건강기능식품으로 인정받은 완제품 중, 농업에 실제적이거나 잠재적인 가치가 있는 미생물, 분류학상 곤충강에 속하는 동물과 거미류·지네류 등 「곤충산업의 육성 및 지원에 관한 법률」이 곤충으로 정하는 무척추동물(사슴벌레·동애등에·뒤영벌·천적 응애 등) 중 농업·식품·사료·소재 분야에서 산업적으로 이용되는 것 또는 육상·해양 생물체와 그 세포·조직배양 산물 등 생물기원 천연물을 원료·성분으로 이용하고, 생명공학 관련 기술·생물공정의 직접 기여가 함께 입증된 것을 제조하는 산업활동을 말한다.","exclude":"건강기능식품이라는 이유만으로 자동 포함하지 않으며, 일반 영양식품과 기능성 표시만 있는 식품의 제조는 제외한다. 특별한 영양관리가 필요한 대상을 위한 특수영양식품과 임상적 상태에 따라 식사를 대신하는 특수의료용도식품의 제조도 제외한다. 완제품이 아니라 다른 식품 제조에 투입되는 기능성 원료·중간소재의 제조도 제외한다."},{"code":"334","jung":"33","name":"그린바이오 특수영양·특수의료용도식품 제조업","def":"영·유아, 비만자 또는 임산·수유부 등 특별한 영양관리가 필요한 특정 대상을 위하여 식품과 영양성분을 배합하는 등의 방법으로 제조·가공한 조제유류·조제식·이유식·체중조절용 조제식품·임산수유부용 식품·고령자용 영양조제식품과, 정상적으로 섭취·소화·흡수 또는 대사할 수 있는 능력이 제한되거나 질병·수술 등의 임상적 상태로 인하여 일반인과 생리적으로 특별히 다른 영양요구량을 가진 사람에게 식사의 function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}
function esc(s){
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ---------------- 현황 tab ----------------
function renderStatus(){
  const root = document.getElementById('panel-status');
  const dae = DATA.dae, jung = DATA.jung, so = DATA.so;

  root.appendChild(el('div','section-title','생태계 구성 — 핵심 · 후방 · 전방 · 지원산업'));
  const byCode = new Map(dae.map(d=>[d.code,d]));
  const makeEcoCard = code=>{
    const d = byCode.get(code);
    if(!d) throw new Error('대분류 코드 누락: '+code);
    const box = el('div','eco-card');
    box.dataset.code = code;
    const role = el('div','role');
    role.textContent = d.role;
    const name = el('div','name');
    name.textContent = d.code+'. '+d.name;
    box.appendChild(role);
    box.appendChild(name);
    return box;
  };
  const makeEcoArrow = ()=>{
    const arrow = el('div','eco-arrow','&rarr;');
    arrow.setAttribute('aria-hidden','true');
    return arrow;
  };

  const ecosystem = el('figure','ecosystem-map');
  const mainFlow = el('div','eco-main');
  mainFlow.setAttribute('aria-label','그린바이오산업 주 가치사슬');
  mainFlow.appendChild(makeEcoCard('1'));
  mainFlow.appendChild(makeEcoArrow());

  const coreGroup = el('div','eco-core-group');
  coreGroup.setAttribute('role','group');
  coreGroup.setAttribute('aria-label','핵심산업: 생물자원 생산업과 제조업');
  coreGroup.appendChild(el('div','eco-core-title','핵심산업 · 직접 생산 영역'));
  const coreFlow = el('div','eco-core-flow');
  coreFlow.appendChild(makeEcoCard('2'));
  coreFlow.appendChild(makeEcoArrow());
  coreFlow.appendChild(makeEcoCard('3'));
  coreGroup.appendChild(coreFlow);
  mainFlow.appendChild(coreGroup);

  mainFlow.appendChild(makeEcoArrow());
  mainFlow.appendChild(makeEcoCard('4'));
  ecosystem.appendChild(mainFlow);

  const supportBridge = el('div','eco-support-bridge');
  supportBridge.setAttribute('aria-hidden','true');
  for(let i=0;i<4;i++) supportBridge.appendChild(el('span','', '&uarr;'));
  ecosystem.appendChild(supportBridge);

  const supportData = byCode.get('5');
  const supportCard = el('div','eco-support-card');
  supportCard.dataset.code = '5';
  const supportIdentity = el('div','identity');
  const supportRole = el('div','role');
  supportRole.textContent = supportData.role;
  const supportName = el('div','name');
  supportName.textContent = supportData.code+'. '+supportData.name;
  supportIdentity.appendChild(supportRole);
  supportIdentity.appendChild(supportName);
  supportCard.appendChild(supportIdentity);
  if(supportData.roleDesc){
    const scope = el('div','scope');
    scope.textContent = supportData.roleDesc;
    supportCard.appendChild(scope);
  }
  ecosystem.appendChild(supportCard);

  root.appendChild(ecosystem);

  root.appendChild(el('div','section-title','대분류별 중·소분류 분포'));
  const table = el('table','dist-table');
  const thead = el('thead','', '<tr><th>대분류</th><th style="text-align:right">중분류</th><th style="text-align:right">소분류</th></tr>');
  table.appendChild(thead);
  const tbody = el('tbody');
  let tJ=0,tS=0;
  dae.forEach(d=>{
    const jList = jung.filter(j=>j.dae===d.code);
    const jCodes = jList.map(j=>j.code);
    const sList = so.filter(s=>jCodes.includes(s.jung));
    tJ+=jList.length; tS+=sList.length;
    const tr = el('tr','', '<td>'+esc(d.code)+'. '+esc(d.name)+'</td>' +
      '<td class="num">'+jList.length+'</td><td class="num">'+sList.length+'</td>');
    tbody.appendChild(tr);
  });
  tbody.appendChild(el('tr','', '<td>합계 '+dae.length+'개 대분류</td><td class="num">'+tJ+'</td><td class="num">'+tS+'</td>'));
  table.appendChild(tbody);
  root.appendChild(table);
}

function renderMethod(){
  const root = document.getElementById('panel-method');

  root.innerHTML = `
<p class="method-lead">「그린바이오산업 육성에 관한 법률」이 정한 산업의 규모와 구조를 통계로 포착하기 위한 산업 특수분류 작업안이다.</p>

<div class="section-title">산업 범위를 정하는 두 요건</div>
<p class="method-lead">일반 바이오산업이 그대로 들어오지 않도록 두 요건을 모두 충족해야 포함한다. 이름에 ‘바이오’가 있거나 생물에서 유래했다는 사실, 그린바이오기업과 거래한다는 사실만으로는 충족하지 않는다.</p>

  <figcaption>「그린바이오산업 육성에 관한 법률」 제2조(정의)</figcaption>
  <p>1. “그린바이오”란 「농업생명자원의 보존ㆍ관리 및 이용에 관한 법률」 제2조제1호에 따른 농업생명자원 등에 「생명공학육성법」 제2조제1호의 생명공학과 관련된 기술을 적용하는 것을 말한다.</p>

    <p><b>「생명공학육성법」 제2조제1호</b> — “생명공학”이란 각종 생물체의 생물학적 시스템, 생체, 유전체 또는 그들로부터 유래되는 물질ㆍ정보를 연구ㆍ활용하는 학문과 기술을 말하며, 기초의과학(基礎醫科學)을 포함한다.</p>
  </div>
  <p>2. “그린바이오산업”이란 그린바이오를 활용하여 농업 및 농업 관련 전ㆍ후방 산업에 부가가치를 창출하는 산업으로서, 다음 각 목과 관련된 재화 또는 서비스를 개발ㆍ생산ㆍ판매ㆍ유통하는 산업을 말한다.</p>
  <ol>
    <li>가. 「종자산업법」 제2조제1호에 따른 종자</li>
    <li>나. 「농업생명자원의 보존ㆍ관리 및 이용에 관한 법률」 제2조제1호에 따른 농업생명자원으로서의 미생물</li>
    <li>다. 「곤충산업의 육성 및 지원에 관한 법률」 제2조제1호에 따른 곤충</li>
    <li>라. 「천연물신약 연구개발 촉진법」 제2조제1호에 따른 천연물</li>
    <li>마. 「식품산업진흥법」 제2조제1호의 식품의 제조에 사용되는 원재료 또는 중간생산물로서 분말, 액상 등 별도의 형태로 가공된 것</li>
    <li>바. 그 밖에 대통령령으로 정하는 것</li>
  </ol>
  <div class="law-sub">
    <p><b>「그린바이오산업 육성에 관한 법률 시행령」 제2조</b> — 법 제2조제2호바목에서 “대통령령으로 정하는 것”이란 「약사법」 제2조제4호에 따른 의약품으로서 <b>동물용으로만 사용할 것을 목적으로 하는 의약품</b>을 말한다.</p>
    <p>따라서 산업범위를 정하는 관련 분야는 여섯이다.</p>
  </div>
</figure>
<div class="method-block"><ul>
  <li><b>요건 A · 관련 분야</b> — 법이 열거한 여섯 분야와 직접 연결될 것
    <ul><li>종자 / 농업에 실제적·잠재적 가치가 있는 미생물 / 곤충 / 천연물 / 식품 제조용 가공 원재료·중간생산물 / 동물용 의약품</li></ul></li>
  <li><b>요건 B · 그린바이오 직접성</b> — 다음 중 하나가 객관적으로 확인될 것
    <ul>
      <li>생명공학 관련 기술·생물공정이 생물자원·공정·산출물에 직접 적용됨</li>
      <li>기자재·서비스가 그린바이오 연구·생산에 전용되거나 주로 사용되거나 실질적으로 특화됨</li>
      <li>도소매·서비스의 대상과 관련 매출을 일반 상품·서비스와 분리해 식별할 수 있음</li>
    </ul></li>
  <li><b>두 요건의 실제 작동 사례</b> — 가축 정액·수정란 생산업은 농업생명자원인 동물에 생명공학 기술을 적용하므로 요건 B는 충족하지만, 여섯 관련 분야 어디에도 열거되지 않아 요건 A를 통과하지 못한다. 따라서 분류 본체에서 제외하고 법률상 포함 후보로만 기록했다.</li>
</ul></div>

<div class="section-title">분류 설계 원칙</div>
<div class="method-block"><ul>
  <li><b>설계 방식</b> — 대분류는 정책 골격으로 하향식 확정하고, 중·소분류는 실제 사업체 활동에서 반복 관찰되는 군집으로 상향식 도출했다. 최종 항목 수를 미리 고정하지 않는다.</li>
  <li><b>생태계 구성</b> — 핵심산업(생물자원 생산·제조)에 직접 후방(기자재 공급), 직접 전방(도소매), 직접 지원(서비스)을 더한 네 부문으로 구성한다.</li>
  <li><b>계층은 3단계</b> — 대·중·소분류까지만 본체에 둔다. 소분류 아래 72개를 시험 설계한 세분류안은 과도한 세분화로 판단해 참고자료로만 보존했다.</li>
  <li><b>규모의 근거</b> — 통계분류포털에 게시된 산업 특수분류 37종을 전수 비교한 결과 3단계가 22종으로 가장 많고 대·중·소분류 수의 중앙값은 각각 5·14·34였다. 이를 근거로 잠정 목표범위를 대5 / 중15~20 / 소30~50으로 두었고 현재 안은 그 범위 안에 있다. 5단계 구조는 농림축산식품산업 1종뿐이라 일반 규칙으로 삼지 않았다.</li>
</ul></div>

function renderDownload(){
  const root = document.getElementById('panel-download');
  const bytes = Math.round(XLSX_B64.length * 3 / 4);
  const size = bytes > 1024 ? (bytes/1024).toFixed(0)+'KB' : bytes+'B';

  root.appendChild(el('div','section-title','그린바이오산업 특수분류표 내려받기'));

  const card = el('div','dl-card');
  card.appendChild(el('h3','','그린바이오산업 특수분류(안) 대·중·소분류표'));

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'dl-btn';
  btn.textContent = '엑셀 파일 다운로드 (.xlsx)';
  btn.addEventListener('click', downloadWorkbook);
  card.appendChild(btn);
  card.appendChild(el('div','dl-meta', '파일명 그린바이오산업_특수분류표.xlsx · 약 '+size));
  root.appendChild(card);
}

function downloadWorkbook(){
  if(!XLSX_B64){
    alert('엑셀 데이터가 아직 생성되지 않았습니다. build_index.py를 실행하세요.');
    return;
  }
  const bin = atob(XLSX_B64);
  const bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const blob = new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '그린바이오산업_특수분류표.xlsx';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

// ---------------- 분류표 tab ----------------
let currentLevel = 'dae'; // dae, jung, so
let showAllDefinitions = false;
let definitionCheckbox = null;

const PANELS = {
  def: {label:'정의', cls:'node-def', open:'def-open'}
};

function levelRank(l){ return {dae:0,jung:1,so:2}[l]; }

function syncPanelCheckbox(kind){
  const box = definitionCheckbox;
  if(!box) return;
  const spec = PANELS[kind];
  const nodes = [...document.querySelectorAll('#panel-table .node')]
    .filter(node=>node.querySelector(':scope > .node-detail > .'+spec.cls));
  const openCount = nodes.filter(node=>node.classList.contains(spec.open)).length;
  box.checked = nodes.length > 0 && openCount === nodes.length;
  box.indeterminate = openCount > 0 && openCount < nodes.length;
  showAllDefinitions = box.checked;
}

function createNode(level, item, children=[], initialExpanded=false){
  const {code, name, def} = item;
  const hasChildren = children.length > 0;
  const node = el('div','node node-'+level+(hasChildren ? ' has-kids' : ''));
  const row = el('div','row');
  const codeEl = el('span','code');
  codeEl.textContent = code;
  row.appendChild(codeEl);

  let nameControl;
  if(hasChildren){
    nameControl = document.createElement('button');
    nameControl.type = 'button';
    nameControl.className = 'name btn-node-name';
  }else{
    nameControl = el('span','name');
  }
  nameControl.textContent = name;
  row.appendChild(nameControl);

  const actions = el('span','row-actions');
  const detail = el('div','node-detail');
  // 정의는 토글로 여닫는다.
  const addPanel = (kind, panel, initiallyOpen)=>{
    const spec = PANELS[kind];
    panel.classList.add(spec.cls);
    panel.id = kind+'-'+level+'-'+code;
    detail.appendChild(panel);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn-def';
    btn.textContent = spec.label;
    btn.setAttribute('aria-controls', panel.id);
    const apply = opened=>{
      node.classList.toggle(spec.open, opened);
      panel.hidden = !opened;
      btn.setAttribute('aria-expanded', String(opened));
      btn.setAttribute('aria-label', code+' '+name+' '+spec.label+' '+(opened ? '접기' : '보기'));
    };
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      apply(!node.classList.contains(spec.open));
      syncPanelCheckbox(kind);
    });
    apply(initiallyOpen);
    actions.appendChild(btn);
  };

  if(def) addPanel('def', defBlock(item), showAllDefinitions);

  let toggleBtn = null;
  if(hasChildren){
    toggleBtn = document.createElement('button');
    toggleBtn.type = 'button';
    toggleBtn.className = 'btn-toggle';
    toggleBtn.appendChild(el('span','chev','▶'));
    actions.appendChild(toggleBtn);
  }
  row.appendChild(actions);

  node.appendChild(row);
  if(detail.children.length) node.appendChild(detail);

  const kids = el('div','kids');
  kids.id = 'children-'+level+'-'+code;
  kids.hidden = true;
  children.forEach(child => kids.appendChild(child));
  node.appendChild(kids);

  if(hasChildren){
    const setExpanded = expanded=>{
      node.classList.toggle('expanded', expanded);
      kids.hidden = !expanded;
      nameControl.setAttribute('aria-expanded', String(expanded));
      toggleBtn.setAttribute('aria-expanded', String(expanded));
      const action = expanded ? '접기' : '펼치기';
      nameControl.setAttribute('aria-label', code+' '+name+' 하위 분류 '+action);
      toggleBtn.setAttribute('aria-label', code+' '+name+' 하위 분류 '+action);
      toggleBtn.title = '하위 분류 '+action;
    };
    const toggleExpanded = ()=>setExpanded(!node.classList.contains('expanded'));
    nameControl.setAttribute('aria-controls', kids.id);
    toggleBtn.setAttribute('aria-controls', kids.id);
    nameControl.addEventListener('click', toggleExpanded);
    toggleBtn.addEventListener('click', toggleExpanded);
    setExpanded(initialExpanded);
  }

  return node;
}

function renderTable(){
  const root = document.getElementById('panel-table');
  root.innerHTML = '';

  const toolbar = el('div','toolbar');
  const controls = el('div','level-controls');
  controls.setAttribute('role','group');
  controls.setAttribute('aria-label','표시할 분류 층위 선택');
  const levels = [['dae','대분류'],['jung','중분류'],['so','소분류']];
  levels.forEach(([lv,label])=>{
    const b = el('button','level-key '+lv+(lv===currentLevel ? ' active':''),esc(label));
    b.type = 'button';
    b.setAttribute('aria-pressed', String(lv===currentLevel));
    b.addEventListener('click', ()=>{ currentLevel = lv; renderTable(); });
    controls.appendChild(b);
  });
  toolbar.appendChild(controls);

  const makeControl = (kind, text)=>{
    const spec = PANELS[kind];
    const wrap = el('label','definition-control');
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = showAllDefinitions;
    box.setAttribute('aria-label', '전체 '+text);
    box.addEventListener('change', ()=>{
      const on = box.checked;
      box.indeterminate = false;
      showAllDefinitions = on;
      document.querySelectorAll('#panel-table .node').forEach(node=>{
        const panel = node.querySelector(':scope > .node-detail > .'+spec.cls);
        if(!panel) return;
        const btn = node.querySelector(':scope > .row [aria-controls="'+panel.id+'"]');
        node.classList.toggle(spec.open, on);
        panel.hidden = !on;
        if(btn){
          btn.setAttribute('aria-expanded', String(on));
          btn.setAttribute('aria-label',
            (btn.getAttribute('aria-label')||'').replace(/(보기|접기)$/, on ? '접기' : '보기'));
        }
      });
    });
    wrap.appendChild(box);
    wrap.appendChild(document.createTextNode(text));
    toolbar.appendChild(wrap);
    return box;
  };

  definitionCheckbox = makeControl('def', '정의 보기');
  root.appendChild(toolbar);

  const rank = levelRank(currentLevel);
  const tree = el('div','tree');

  DATA.dae.forEach(d=>{
    const jungChildren = [];
    const jList = DATA.jung.filter(j=>j.dae===d.code);
    jList.forEach(j=>{
      const soChildren = [];
      const sList = DATA.so.filter(s=>s.jung===j.code);
      sList.forEach(s=>{
        soChildren.push(createNode('so', s));
      });
      jungChildren.push(createNode('jung', j, soChildren, rank >= 2));
    });
    tree.appendChild(createNode('dae', d, jungChildren, rank >= 1));
  });

  root.appendChild(tree);
  syncPanelCheckbox('def');
}

function defBlock(item){
  const b = el('div','def-block');
  const hasIncludeList = Array.isArray(item.include) && item.include.length > 0;

  b.appendChild(el('div','lbl', hasIncludeList ? '정의' : '정의&middot;포함'));
  b.appendChild(el('div','', esc(item.def)));

  const addList = (cls, label, value)=>{
    if(!value || (Array.isArray(value) && value.length === 0)) return;
    const sec = el('div', cls);
    sec.appendChild(el('div','lbl', label));
    if(Array.isArray(value)){
      const ul = el('ul','def-list');
      value.forEach(v=>{
        const li = document.createElement('li');
        li.textContent = v;
        ul.appendChild(li);
      });
      sec.appendChild(ul);
    }else{
      sec.appendChild(el('div','', esc(value)));
    }
    b.appendChild(sec);
  };

  addList('incl', '포함', item.include);
  addList('excl', '주요 제외&middot;이동', item.exclude);

  return b;
}

document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
  });
});
