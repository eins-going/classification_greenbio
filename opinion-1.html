<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>그린바이오산업 특수분류(안)</title>
  <style>
  @font-face{font-family:"Pretendard";src:url("assets/fonts/Pretendard-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap;}
  @font-face{font-family:"Pretendard";src:url("assets/fonts/Pretendard-Medium.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap;}
  @font-face{font-family:"Pretendard";src:url("assets/fonts/Pretendard-SemiBold.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap;}
  @font-face{font-family:"Pretendard";src:url("assets/fonts/Pretendard-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap;}
:root{
  color-scheme:light;
  --bg:#f8fafd;
  --surface:#ffffff;
  --surface-2:#f1f3f4;
  --surface-hover:#f8fafd;
  --border:#dfe3e8;
  --border-strong:#c4c7c5;
  --text:#1f1f1f;
  --text-muted:#5f6368;
  --accent:#0b57d0;
  --accent-strong:#0842a0;
  --accent-soft:#e8f0fe;
  --accent-soft-border:#a8c7fa;
  --code-bg:#f1f3f4;
  --shadow:none;
  --radius:0;
  --tier-dae-ink:#0b57d0;
  --tier-jung-ink:#137333;
  --tier-so-ink:#7b1fa2;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{background:var(--bg);}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:14.5px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font:inherit;}
::selection{background:var(--accent-soft);color:var(--text);}

.wrap{width:100%;max-width:1200px;margin:0;padding:28px 28px 72px;}

header.top{
  display:flex;flex-direction:column;gap:5px;
  margin-bottom:20px;padding:2px 2px 0;
}
header.top .title-row{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;
}
header.top h1{
  font-size:30px;line-height:1.25;margin:0;font-weight:600;letter-spacing:-0.02em;
  text-wrap:balance;color:var(--text);
}
header.top .doc-label{
  font-size:14px;font-weight:500;color:var(--text-muted);
  white-space:nowrap;letter-spacing:-0.01em;
}

nav.tabs{
  display:flex;gap:2px;margin:0 0 24px;padding:0 10px;
  background:var(--surface);border:1px solid var(--border);border-radius:0;
  overflow-x:auto;scrollbar-width:none;
}
nav.tabs::-webkit-scrollbar{display:none;}
nav.tabs button{
  appearance:none;border:none;background:none;cursor:pointer;
  min-height:48px;padding:11px 16px;font-size:14px;font-weight:500;color:var(--text-muted);
  border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;
}
nav.tabs button:hover{color:var(--accent);background:var(--surface-hover);}
nav.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:0;}

.panel{display:none;}
.panel.active{display:block;}
#panel-status,#panel-method,#panel-download{
  background:var(--surface);border:1px solid var(--border);border-radius:0;
  padding:24px 26px;
}

/* ---------- 개발원칙 tab ---------- */
.method-lead{
  font-size:13.5px;line-height:1.7;color:var(--text-muted);
  margin:0 0 4px;
}
.method-block{margin:0 0 4px;}
.method-block > ul{margin:8px 0 0;padding-left:18px;}
.method-block li{margin:5px 0;line-height:1.65;font-size:13.5px;}
.method-block li > ul{margin:4px 0 6px;padding-left:17px;}
.method-block li > ul li{color:var(--text-muted);font-size:13px;margin:3px 0;}
.method-block b{font-weight:600;}
.law-box{
  margin:14px 0 6px;padding:16px 18px;
  background:var(--accent-soft);border:1px solid var(--accent-soft-border);
  border-radius:var(--radius);
}
.law-box ::selection{background:var(--accent);color:#fff;}
.law-box figcaption{
  font-size:11.5px;font-weight:700;letter-spacing:.03em;
  color:var(--accent-strong);margin-bottom:10px;
}
.law-box p{margin:0 0 7px;font-size:13.5px;line-height:1.78;}
/* 회의 기록 원문을 줄바꿈·들여쓰기 그대로 보존한다 */
.law-box .revision-text{
  margin:0;font-family:inherit;font-size:13.5px;line-height:1.78;
  white-space:pre-wrap;word-break:keep-all;overflow-wrap:break-word;
}
.law-box ol{margin:7px 0 4px;padding:0;list-style:none;}
.law-box ol li{
  font-size:13px;line-height:1.72;margin:3px 0;
  padding-left:1.9em;text-indent:-1.9em;
}
.law-sub{
  margin:9px 0 12px 1.9em;padding:11px 14px;
  background:var(--surface);border:1px solid var(--accent-soft-border);
  border-radius:0;
}
.law-sub p{margin:0 0 6px;font-size:12.5px;line-height:1.72;color:var(--text-muted);}
.law-sub p:last-child{margin-bottom:0;}
.law-sub b{color:var(--text);font-weight:600;}

.ref-table{
  width:100%;border:1px solid var(--border);border-collapse:separate;border-spacing:0;
  border-radius:0;overflow:hidden;margin:10px 0 4px;background:var(--surface);font-size:13px;
}
.ref-table th,.ref-table td{
  text-align:left;padding:8px 11px;border-bottom:1px solid var(--border);vertical-align:top;
}
.ref-table th{
  background:var(--surface-hover);color:var(--text-muted);font-weight:600;font-size:12px;
}
.ref-table tr:last-child td{border-bottom:none;}
.ref-table td.src{color:var(--text-muted);}

/* ---------- 다운로드 tab ---------- */
.dl-card{
  border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;background:var(--surface-hover);
}
.dl-card h3{margin:0 0 4px;font-size:15px;font-weight:600;}
.dl-card p{margin:0 0 14px;font-size:13px;line-height:1.7;color:var(--text-muted);}
.dl-btn{
  appearance:none;border:1px solid var(--accent);border-radius:0;background:var(--accent);
  color:#fff;font-family:inherit;font-size:13.5px;font-weight:600;
  min-height:40px;padding:9px 18px;cursor:pointer;
}
.dl-btn:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
.dl-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.dl-meta{margin-top:10px;font-size:12px;color:var(--text-muted);}

/* ---------- 현황 tab ---------- */
.section-title{
  font-size:15px;font-weight:600;letter-spacing:0;
  color:#3c4043;margin:32px 0 12px;
}
.section-title:first-child{margin-top:0;}

.ecosystem-map{margin:16px 0 8px;}
.eco-main{
  display:grid;grid-template-columns:minmax(150px,1fr) 30px minmax(360px,2.2fr) 30px minmax(150px,1fr);
  gap:8px;align-items:stretch;
}
.eco-card{
  min-width:0;position:relative;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;box-shadow:none;
}
.eco-card .role,.eco-support-card .role{
  font-size:10.5px;font-weight:600;letter-spacing:.03em;
  color:var(--text-muted);margin-bottom:6px;
}
.eco-card .name,.eco-support-card .name{
  position:relative;padding-left:19px;
  font-size:13.5px;font-weight:600;line-height:1.4;word-break:keep-all;overflow-wrap:break-word;
}
/* 번호는 왼쪽에 고정하고 명칭만 들여써서, 명칭이 두 줄로 접힐 때 둘째 줄이 첫 줄에 맞춰 걸리게 한다.
   기준을 .eco-card가 아니라 .name으로 잡아야 위쪽 .role 높이와 무관하게 첫 줄에 정렬된다. */
.eco-card .eco-num,.eco-support-card .eco-num{
  position:absolute;left:0;top:0;font-weight:700;
}
.eco-arrow{
  align-self:center;justify-self:center;color:#80868b;font-size:18px;
  line-height:1;user-select:none;
}
.eco-core-group{
  min-width:0;border:1px solid var(--accent-soft-border);border-radius:0;
  padding:10px;background:#f3f7ff;box-shadow:none;
}
.eco-core-title{
  display:flex;align-items:center;gap:7px;margin:0 2px 7px;
  color:var(--accent);font-size:11px;font-weight:600;letter-spacing:.03em;
}
.eco-core-title::before{
  content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);
}
.eco-core-flow{display:grid;grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr);gap:6px;align-items:stretch;}
.eco-core-flow .eco-card{border-color:#d2e3fc;box-shadow:none;}
.eco-support-bridge{
  display:grid;grid-template-columns:repeat(4,1fr);align-items:end;
  height:27px;margin:0 5%;color:var(--accent);font-size:16px;font-weight:800;
}
.eco-support-bridge span{text-align:center;line-height:1;}
.eco-support-card{
  display:grid;grid-template-columns:minmax(180px,.85fr) minmax(0,2.15fr);
  gap:18px;align-items:center;padding:14px 16px;background:var(--surface-hover);
  border:1px solid var(--accent-soft-border);
  border-radius:var(--radius);box-shadow:none;
}
.eco-support-card .role{margin-bottom:3px;}
.eco-support-card .scope{
  color:var(--text-muted);font-size:12.5px;line-height:1.5;
  border-left:1px solid var(--border);padding-left:18px;
}
.dist-table{
  width:100%;border:1px solid var(--border);border-collapse:separate;border-spacing:0;
  border-radius:0;overflow:hidden;margin:10px 0 4px;background:var(--surface);font-size:13.5px;
}
.dist-table th,.dist-table td{
  text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);
}
.dist-table th{background:var(--surface-hover);color:var(--text-muted);font-weight:600;font-size:12px;letter-spacing:.01em;}
.dist-table tbody tr:hover td{background:var(--surface-hover);}
.dist-table td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;}
.dist-table tr:last-child td{border-bottom:none;font-weight:600;background:var(--surface-hover);}

/* ---------- 분류표 tab ---------- */
.toolbar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  margin-bottom:14px;padding:8px;background:#f2f5f9;
  border:1px solid #d8e0e9;border-radius:0;
}
.level-controls{
  display:inline-flex;flex-wrap:nowrap;gap:2px;align-items:center;padding:3px;
  background:rgba(255,255,255,.86);border:1px solid #d8e0e9;border-radius:0;
}
.definition-control{
  display:inline-flex;align-items:center;gap:7px;min-height:36px;
  padding:7px 11px;color:#465568;font-size:12.5px;font-weight:600;
  cursor:pointer;white-space:nowrap;
}
/* 첫 토글만 남은 공간을 밀어내 오른쪽 묶음으로 만든다. */
.definition-control:first-of-type{margin-left:auto;}
.definition-control input{width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer;}
.level-key{
  appearance:none;display:inline-flex;justify-content:center;align-items:center;min-height:32px;padding:6px 14px;
  border:0;border-radius:0;background:transparent;color:#526173;
  font-family:inherit;font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer;
  transition:background .15s,color .15s,box-shadow .15s;
}
.level-key:hover{background:#e8edf3;color:#24364b;}
.level-key.active{
  background:#345d82;color:#fff;box-shadow:0 1px 2px rgba(31,55,77,.18);
}
.level-key:focus-visible{outline:2px solid #345d82;outline-offset:2px;}

.tree{display:flex;flex-direction:column;gap:8px;}
.node{
  border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
  background:var(--surface);box-shadow:none;
}
.node-dae{--tier-ink:var(--tier-dae-ink);}
.node-jung{--tier-ink:var(--tier-jung-ink);}
.node-so{--tier-ink:var(--tier-so-ink);}
.row{
  display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 12px;
  background:var(--surface);
  transition:background .15s;
}
.node > .row:hover{background:var(--surface-hover);}
.node.expanded > .row,
.node.def-open > .row{border-bottom:1px solid var(--border);}
.node > .kids{display:none;padding:10px 10px 12px 12px;background:var(--surface-hover);}
.node.expanded > .kids{display:flex;flex-direction:column;gap:8px;}
.row .code{
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;
  color:var(--tier-ink);background:var(--code-bg);border:1px solid var(--border);
  border-radius:0;padding:3px 7px;flex:0 0 auto;font-variant-numeric:tabular-nums;
}
/* 대분류: code 뱃지를 왼쪽에 절대배치하고 name에 내어쓰기(행걸침) —
   명칭이 2줄로 꺾여도 둘째 줄이 뱃지 오른쪽 들여쓰기 위치에 정렬된다 */
.node-dae > .row{position:relative;}
.node-dae > .row .code{
  font-size:13px;font-weight:600;
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
}
.row .name{
  min-width:0;color:var(--tier-ink);font-family:inherit;font-weight:700;font-size:14px;
  flex:1 1 auto;text-align:left;text-wrap:balance;
}
.node-dae > .row .name{font-size:15px;font-weight:700;padding-left:46px;}
.btn-node-name{
  appearance:none;border:0;background:transparent;margin:0;padding:3px 2px;
  min-width:0;cursor:pointer;border-radius:0;
}
.btn-node-name:hover{color:var(--tier-ink);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;}
.btn-node-name:focus-visible,.btn-toggle:focus-visible,.btn-def:focus-visible{
  outline:2px solid var(--tier-ink, var(--accent));outline-offset:2px;
}
.row-actions{
  display:flex;align-items:center;gap:6px;margin-left:auto;flex:0 0 auto;
}
.btn-def{
  appearance:none;border:1px solid var(--border);border-radius:0;
  min-height:32px;padding:4px 10px;font-size:12px;font-weight:600;background:var(--surface);
  color:var(--tier-ink);cursor:pointer;font-family:inherit;
  transition:background .15s,border-color .15s;
}
.btn-def:hover,.btn-def[aria-expanded="true"]{background:var(--surface-hover);border-color:var(--border-strong);}
.btn-toggle{
  appearance:none;border:0;border-radius:0;background:transparent;color:var(--tier-ink);
  width:32px;height:32px;padding:0;display:inline-grid;place-items:center;cursor:pointer;
}
.btn-toggle:hover{background:var(--surface-hover);}
.row .chev{
  display:inline-block;font-size:12px;line-height:1;transition:transform .15s;
}
.node.expanded > .row .chev{transform:rotate(90deg);}

.node-detail{display:none;margin:10px 12px;gap:10px;}
.node.def-open > .node-detail{display:flex;flex-wrap:wrap;align-items:flex-start;}
.node-detail > *{flex:1 1 330px;min-width:0;}
.node-detail > *[hidden]{display:none;}
.def-block{
  padding:12px 14px;background:var(--surface-hover);
  border:1px solid var(--border);border-radius:0;font-size:13px;color:var(--text);
  display:block;
}
.def-block .lbl{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--tier-ink);margin-bottom:3px;}
.def-block .incl{margin-top:9px;}
.def-block .excl{margin-top:9px;color:var(--text-muted);}
.def-block .excl .lbl{color:var(--text-muted);}
.def-block .def-list{margin:2px 0 0;padding-left:17px;}
.def-block .def-list li{margin:3px 0;}

@media (prefers-reduced-motion:reduce){.row .chev{transition:none;}}


@media (max-width:760px){
  .wrap{padding:24px 18px 60px;}
  #panel-status{padding:20px;}
  .eco-main{grid-template-columns:1fr;gap:6px;}
  .eco-main > .eco-arrow,.eco-core-flow > .eco-arrow{
    min-height:20px;transform:rotate(90deg);
  }
  .eco-core-flow{grid-template-columns:1fr;}
  .eco-support-bridge{visibility:hidden;height:18px;margin:0;}
  .eco-support-card{grid-template-columns:1fr;gap:5px;}
  .eco-support-card .scope{
    border-left:0;border-top:1px solid var(--border);padding:8px 0 0;
  }
}

@media (max-width:640px){
  .wrap{padding:20px 14px 56px;}
  header.top{margin-bottom:17px;}
  header.top h1{font-size:25px;}
  nav.tabs{margin-bottom:18px;padding:0 6px;}
  nav.tabs button{padding:10px 13px;}
  #panel-status{padding:18px 16px;}
  .toolbar{align-items:flex-start;padding:10px;}
  .level-controls{flex:1;}
  .node > .kids{padding-left:6px;padding-right:4px;}
  .row{gap:7px;padding:9px 8px;align-items:flex-start;}
  .node-dae > .row .code{left:8px;top:9px;transform:none;}
  .row-actions{gap:4px;}
  .btn-def{padding:4px 7px;}
  .def-block{margin:8px;}
}

@media (max-width:520px){
  .eco-card,.eco-support-card{padding:12px;}
  .row .name{font-size:13.5px;}
  .node-dae > .row .name{font-size:14px;}
}


/* ---------- 사이드바(자문 의견서 내비게이션) ---------- */
.layout{display:flex;min-height:100vh;align-items:stretch;}
.sidebar{
  flex:0 0 264px;width:264px;
  background:var(--surface);
  border-right:1px solid var(--border);
  position:sticky;top:0;align-self:flex-start;
  height:100vh;overflow-y:auto;
  transition:margin-left .22s ease, transform .22s ease;
  display:flex;flex-direction:column;
}
.sidebar-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 12px 16px 18px;border-bottom:1px solid var(--border);
}
.sidebar-head .sb-title{font-size:14px;font-weight:700;letter-spacing:-0.01em;color:var(--text);}
.sb-toggle{
  appearance:none;border:1px solid var(--border);border-radius:0;background:var(--surface);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;margin-left:auto;
  font-size:21px;font-weight:700;line-height:1;width:30px;height:30px;color:var(--text);padding:0;
}
.sb-toggle:hover{background:var(--surface-hover);border-color:var(--border-strong);color:var(--accent);}
.opinion-nav{padding:8px 10px 20px;display:flex;flex-direction:column;gap:2px;}
.op-item{
  display:flex;flex-direction:column;gap:2px;
  padding:10px 12px;border-radius:0;
  text-decoration:none;color:var(--text);
  border-left:3px solid transparent;cursor:pointer;
}
.op-item:hover{background:var(--surface-hover);}
.op-item.active{background:var(--accent-soft);border-left-color:var(--accent);color:var(--accent-strong);}
.op-item .op-no{font-size:13.5px;font-weight:600;}
.op-item.active .op-no{font-weight:700;}
.op-item .op-date{font-size:11.5px;color:var(--text-muted);}
.op-item.disabled{color:var(--text-muted);cursor:default;}
.op-item.disabled:hover{background:transparent;}
.op-item.disabled .op-no{font-weight:500;}
.content{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;position:relative;}
.mobile-open{display:none;}
.topbar{display:none;}
.btn-menu{display:none;}
.backdrop{display:none;}
/* 데스크탑: 사이드바를 버튼(42px)만 남기고 밀어 넣는다 → 안쪽 버튼이 항상 노출 */
.layout.sidebar-collapsed .sidebar{margin-left:-222px;}
.layout.sidebar-collapsed .wrap{max-width:1422px;}

@media (max-width:860px){
  .layout{flex-direction:column;}
  .sidebar{
    position:fixed;top:0;left:0;z-index:60;height:100vh;width:264px;
    transform:translateX(-100%);transition:transform .22s ease;margin-left:0;
    box-shadow:2px 0 12px rgba(0,0,0,.12);
  }
  .layout.sidebar-collapsed .sidebar{transform:translateX(-100%);margin-left:0;}
  .layout:not(.sidebar-collapsed) .sidebar{transform:translateX(0);}
  .layout.sidebar-collapsed .wrap{max-width:1200px;}
  .content{min-height:100vh;}
  .backdrop{display:none;position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.35);}
  .layout:not(.sidebar-collapsed) .backdrop{display:block;}
  /* 모바일: 사이드바가 화면 밖으로 가므로 다시 열 버튼을 좌측에 띄운다 */
  .layout.sidebar-collapsed .mobile-open{
    display:inline-flex;position:fixed;top:10px;left:10px;z-index:50;
    align-items:center;justify-content:center;width:34px;height:34px;

// ---------------- 사이드바 토글 ----------------
(function(){
  const layout = document.getElementById('layout');
  const sbToggle = document.getElementById('sidebarToggle');
  const mobileOpen = document.getElementById('mobileOpen');
  const backdrop = document.getElementById('backdrop');
  const mq = window.matchMedia('(max-width: 860px)');
  const KEY = 'gb-sidebar-collapsed';

  function apply(){
    const collapsed = layout.classList.contains('sidebar-collapsed');
    sbToggle.textContent = collapsed ? '‹' : '›';
    sbToggle.setAttribute('aria-expanded', String(!collapsed));
    sbToggle.setAttribute('aria-label', collapsed ? '사이드바 펴기' : '사이드바 접기');
    mobileOpen.textContent = '‹';
    if(mq.matches){
      backdrop.style.display = collapsed ? 'none' : 'block';
    } else {
      backdrop.style.display = 'none';
    }
  }
  function setCollapsed(v){
    layout.classList.toggle('sidebar-collapsed', v);
    try{ localStorage.setItem(KEY, v ? '1':'0'); }catch(e){}
    apply();
  }
  function toggle(){
    setCollapsed(!layout.classList.contains('sidebar-collapsed'));
  }

  if(sbToggle) sbToggle.addEventListener('click', toggle);
  if(mobileOpen) mobileOpen.addEventListener('click', ()=> setCollapsed(false));
  backdrop.addEventListener('click', ()=> setCollapsed(true));
  // 화면 크기 전환 시 모바일에서는 기본 열림, 데스크탑에서는 기본 펴짐
  mq.addEventListener('change', ()=>{
    if(mq.matches){ setCollapsed(false); }
    else { setCollapsed(true); }
  });

  // 초기 상태: 데스크탑은 기본 펴짐(접힘 해제), 모바일은 기본 열림
  let saved;
  try{ saved = localStorage.getItem(KEY); }catch(e){ saved = null; }
  if(mq.matches){ setCollapsed(false); }
  else { setCollapsed(saved === '1'); }

·소재·제품에 대해 효능·독성·위해성·품질 시험, 유전체·성분·생물정보 분석, 검사·검증 또는 인증을 제공하는 산업활동을 말한다.","exclude":["일반 의약·식품·환경 시험, 내부 품질관리, 시설·장비 자체의 검증·교정 서비스, 인증 취득을 위한 준비·인허가 자문"]},{"code":"59","dae":"5","criterion":"인허가·사업화 지원, 시설·장비 활용, 전문물류·운영지원","name":"기타 그린바이오 관련 서비스업","def":"그린바이오 생물자원이나 생명공학 관련 기술·생물공정이 제품기능 또는 제조공정에 직접 기여하는 재화의 사업화와 생산활동을 지원하는 서비스 중, 연구개발·시험·인증·정보·데이터·교육에 해당하지 않는 것을 수수료·계약에 따라 외부 고객에게 제공하는 산업활동을 말한다. 연구개발, 시험·인증, 정보·데이터, 교육의 정의에 해당하면 그 코드를 우선하고, 어느 것에도 해당하지 않는 지원서비스만 이 중분류로 분류한다.","include":["인허가·규제 대응과 품질·안전·인증체계 구축 자문","기술이전·지식재산·창업·투자유치·수출 지원","전용·특화 시설·장비의 임대·공동활용·유지관리·수리·검증·교정","생물학적 품질·안전·저온·추적성이 요구되는 전문 물류·보관과 시설·공정 운영지원. 각 서비스는 계약·매출을 일반 서비스와 분리할 수 있어야 한다"],"exclude":["시험·검사·검증·심사 결과를 발급하는 서비스, 조직적 교육, 시설·장비의 판매와 부수 설치, 상품 매매와 CMO·CDMO, 그린바이오 계약·전담역량·매출을 분리하지 못하는 일반 RA·ISO·창업·광고·법률·회계·금융 지원과 일반 장비수리·임대·냉장물류·공장운영"]}],"so":[{"code":"110","jung":"11","name":"그린바이오 기자재 제조업","def":"생명공학 관련 기술이 적용되는 종자·미생물·곤충·천연물·식품 제조용 원재료·동물용 의약품의 연구·생산·제조에 전용되거나 주로 사용되도록 특화된 기자재를 직접 제조하는 산업활동을 말한다. 배지·배양기질·시약·효소·완충용액·시약키트·유전자 벡터·담체·공정재 등 소모성 자재, 유전·세포·생물정보 또는 성분·품질·안전을 시험·측정·분석하는 연구·분석장비와 그 전용 부품, 배양·발효·분리·정제·건조·제형 장비와 생물자원의 증식·사육·재배 환경제어 장비 등 생산·공정장비를 포함한다.","exclude":"그 연구·생산·제조 공정에 대한 전용·주사용·특화를 증빙할 수 없는 범용 실험소모품·계측기·펌프·탱크·공정기계의 제조와 사람 의료 전용 장비의 제조는 제외한다. 타사가 제조한 기자재의 매입·수입·재판매, 장비를 이용해 외부 고객에게 분석결과를 제공하는 용역과 장비의 임대·유지관리 서비스도 제외한다."},{"code":"120","jung":"12","name":"그린바이오 기자재 도매업","def":"생명공학 관련 기술이 적용되는 종자·미생물·곤충·천연물·식품 제조용 원재료·동물용 의약품의 연구·생산·제조에 전용되거나 주로 사용되도록 특화된 타사 제조 기자재를 매입하거나 수입하여, 본질적으로 변형하지 않고 사업자·연구기관·생산자에게 재판매하며 해당 품목·매출을 일반 기자재와 분리하는 산업활동을 말한다. 배지·시약·효소·시약키트·담체·공정재 등 소모성 자재, 유전·세포·생물정보와 성분·품질·안전을 시험·측정·분석하는 연구·분석장비, 배양·발효·분리·정제·건조·제형 장비와 생물자원 증식·사육·재배 환경제어 장비 등 생산·공정장비를 포함한다.","exclude":"자체 제조한 기자재의 판매, 전용·주사용·특화를 증빙할 수 없는 범용 소모품·계측기·공정기계의 도매, 사람 의료 전용 장비의 도매와 최종소비자 대상 소매는 제외한다. 장비를 이용해 외부 고객에게 분석결과를 제공하는 용역과 장비의 임대·유지관리 서비스도 제외한다."},{"code":"211","jung":"21","name":"그린바이오 종자·종묘 생산업","def":"생명공학 관련 육종·유전체·선발 기술을 적용하여 식물 품종을 개발하거나 해당 품종의 원원종·원종·모본·부본·보급종·판매용 종자·묘목·묘종·조직배양묘와 「종자산업법」상 종자에 포함되는 버섯 종균을 생산·증식하는 산업활동을 말한다.","exclude":"일반 품종·종자·종묘 생산과 소재 원료 수확 목적의 식물재배는 제외한다."},{"code":"212","jung":"21","name":"그린바이오 소재 원료용 식물 생산업","def":"유용성분·기능성 형질의 탐색·선발·개량 또는 생산관리에 생명공학 관련 기술을 적용하거나, 확인된 그린바이오 소재·제품 제조공정의 성분·품질규격 또는 계약에 따라, 그 원료로 사용하는 식물체 또는 수확물을 재배·생산하는 산업활동을 말한다. 노지·시설·수경·식물공장 등 재배방식은 묻지 않으며, 수확물이 실제로 그린바이오 소재·제품의 원료로 공급되는 관계가 확인되어야 한다.","exclude":"원료 공급관계와 생명공학 관련 기술 적용이 모두 확인되지 않는 일반 식용·약용 작물재배와, 수확물을 분쇄·농축·추출·정제하여 별도 소재로 제조하는 활동은 제외한다."},{"code":"220","jung":"22","name":"그린바이오 곤충자원 생산업","def":"생명공학 관련 기술을 적용해 「곤충산업의 육성 및 지원에 관한 법률」상 곤충, 즉 분류학상 곤충강에 속하는 동물과 거미류·지네류 등 같은 법이 정하는 무척추동물(사슴벌레·동애등에·뒤영벌·천적 응애 등)의 계통·품종을 선발·개량하여 종충·종란 등 증식 기반자원을 생산하거나, 식품·사료·방제·소재용 곤충을 증식·사육하는 산업활동을 말한다. 확인된 그린바이오 제조규격에 따른 계약 사육을 포함한다. 번식 기반자원 생산과 산업용 사육은 공급용도 속성으로 구분한다.","exclude":"일반 애완·관상곤충의 생산·판매와 생명공학 관련 기술 또는 확인된 그린바이오 제조규격과 관계없는 일반 곤충사육은 제외한다. 곤충을 분말·오일·추출물 등으로 가공하는 활동과 체험·교육 서비스도 제외한다."},{"code":"231","jung":"23","name":"그린바이오 미생물자원 생산업","def":"농업에 실제적이거나 잠재적인 가치가 있는 미생물의 종균·스타터·균주 자체를 생명공학 관련 기술로 발굴·제작·배양·증식하여 그린바이오 연구·생산에 공급하는 산업활동을 말한다. 농업·식품·사료·소재 분야에 이용하는 세균·효모·곰팡이·미세조류 등을 포함하며, 그 농업적 가치는 적용 분야와 용도로 확인한다.","exclude":"미생물 대사산물·효소·제형 미생물제제의 제조와, 농업에 대한 실제적·잠재적 가치가 확인되지 않는 사람 의료·환경·에너지용 균주의 생산은 제외한다. 버섯 재배용 종균의 증식·생산과 식물·동물·곤충의 세포·조직자원 생산도 제외한다."},{"code":"232","jung":"23","name":"그린바이오 세포·조직자원 생산업","def":"종자, 농업에 실제적이거나 잠재적인 가치가 있는 미생물, 산업적으로 이용되는 곤충 또는 생물기원 천연물의 원천이 되는 육상·해양 생물체에서 유래한 세포·조직·세포주 자원 자체를 생명공학 관련 기술로 제작·배양·증식하여 그린바이오 연구·생산에 공급하는 산업활동을 말한다.","exclude":"가축의 번식과 품종개량에 사용하는 정액·난자·수정란·배아의 채취·처리·보존은 제외한다. 재배용 완성 묘, 사람 치료용 세포자원과 세포 기반 완제품의 제조도 제외한다."},{"code":"311","jung":"31","name":"생물농약·생물방제제품 제조업","def":"병해충 방제 또는 농작물 생리기능 조절에 사용하는 농약·방제제품 중, 그린바이오 생물자원 또는 생명공학 관련 기술·생물공정을 유효성분이나 방제기능에 직접 이용하여 제조하는 산업활동을 말한다.","exclude":"살아 있는 천적곤충을 원형 그대로 증식·사육하는 활동은 제외한다. 천연식물보호제라는 명칭만 있거나 생물유래 표시만 있는 제품 및 화학농약 제조도 제외한다."},{"code":"312","jung":"31","name":"그린바이오 비료 제조업","def":"미생물·식물·해조류 등 그린바이오 생물자원 또는 발효·효소처리·생물전환 등의 생물공정을 이용하여 식물에 양분을 공급하거나 토양의 물리적·화학적·생물학적 특성을 개선하는 비료를 제조하는 산업활동을 말한다. 유용 미생물, 미생물 배양물·대사산물, 발효 아미노산·유기산 및 생물전환 양분 소재를 이용한 비료를 포함한다.","exclude":"그린바이오 생물자원·생물공정의 직접 기여가 없는 일반 퇴비·유기질비료·화학비료, 비료에 해당하지 않는 생물촉진제와 제형하지 않은 미생물·종균·균주 자체의 생산은 제외한다."},{"code":"319","jung":"31","name":"기타 그린바이오 작물재배용 제품 제조업","def":"그린바이오 생물자원 또는 생명공학 관련 기술·생물공정을 직접 이용하여 작물의 생육·활력·스트레스 저항성이나 재배환경을 개선하는 제품 중 달리 분류되지 않는 것을 제조하는 산업활동을 말한다. 생물촉진제·생물제제 등이 이에 해당한다.","exclude":"그린바이오 직접성이 없는 일반 농자재·단순 영양제·근거 없는 친환경 제품은 제외한다."},{"code":"321","jung":"32","name":"그린바이오 사료 제조업","def":"동물의 영양·건강유지·성장에 필요한 단미사료·배합사료 중, 그린바이오 생물자원이나 발효·효소·생물전환 등 생명공학 관련 생물공정이 영양·기능·안전성에 실질적으로 기여하는 것을 제조하는 산업활동을 말한다.","exclude":"원료명만 생물유래이고 그린바이오 생물자원이나 생명공학 관련 공정의 직접 기여가 없는 일반 배합·단미사료의 제조는 제외한다."},{"code":"322","jung":"32","name":"그린바이오 사료첨가제 제조업","def":"사료의 품질저하를 방지하거나 효용을 높이기 위해 첨가하는 보조사료 중, 생명공학 관련 기술·생물공정으로 생산한 생균제·효소제·아미노산·발효대사산물 등을 제조하는 산업활동을 말한다.","exclude":"생명공학 관련 기술·생물공정의 직접 기여가 없는 화학합성 첨가제, 동물 질병의 예방·진단·치료를 목적으로 하는 동물용 의약품과 제형하지 않은 미생물·종균·균주 자체의 생산은 제외한다."},{"code":"331","jung":"33","name":"그린바이오 식품원료·첨가물 제조업","def":"식품의 제조에 투입되는 원재료·중간생산물과, 식품을 제조·가공·조리 또는 보존하는 과정에서 감미·착색·표백·산화방지 등의 기술적 효과를 내기 위해 소량 사용하는 첨가물 및 발효·가공보조용 효소로서, 그린바이오 미생물·곤충·천연물 등 생물자원 또는 생명공학 관련 기술·생물공정을 직접 이용하여 제조하는 산업활동을 말한다. 최종식품에 배합되어 그 구성 성분을 이루도록 분말·액상 등 별도 형태로 가공한 원료·중간소재와, 기술적 효과를 목적으로 소량 사용하는 첨가물·효소를 함께 포함한다.","exclude":"소비자가 그대로 섭취하는 발효식품·건강기능식품·특수영양식품·특수의료용도식품·대체식품 등 식용 완제품의 제조는 제외한다."},{"code":"332","jung":"33","name":"그린바이오 발효식품 제조업","def":"농업에 실제적이거나 잠재적인 가치가 있는 특정 미생물·스타터와 문서화된 생명공학 관련 제어발효공정이 품질·기능에 실질적으로 기여하도록 식품·음료 완제품을 제조하는 산업활동을 말한다.","exclude":"김치·장류·주류 등 전통·통상 발효식품은 특정 미생물·스타터의 사용과 문서화된 제어발효공정의 직접 기여가 확인되지 않으면 제외한다. 발효가 아닌 방식으로 미생물을 이용한 식품은 기타 그린바이오 식품 제조업으로 옮긴다. 식품으로 제형하지 않은 미생물·종균·스타터 자체의 생산과 그린바이오 직접성이 없는 일반 가공식품의 제조도 제외한다."},{"code":"333","jung":"33","name":"그린바이오 건강기능식품 제조업","def":"인체에 유용한 기능성을 가진 원료나 성분을 사용하여 제조·가공한 식품으로서 「건강기능식품에 관한 법률」에 따라 건강기능식품으로 인정받은 완제품 중, 그린바이오 생물자원을 원료·성분으로 이용하고 생명공학 관련 기술·생물공정의 직접 기여가 함께 입증된 것을 제조하는 산업활동을 말한다.","exclude":"건강기능식품이라는 이유만으로 자동 포함하지 않으며, 일반 영양식품과 기능성 표시만 있는 식품의 제조는 제외한다. 특별한 영양관리가 필요한 대상을 위한 특수영양식품과 임상적 상태에 따라 식사를 대신하는 특수의료용도식품의 제조도 제외한다. 완제품이 아니라 다른 식품 제조에 투입되는 기능성 원료·중간소재의 제조도 제외한다."},{"code":"334","jung":"33","name":"그린바이오 특수영양·특수의료용도식품 제조업","def":"영·유아, 비만자 또는 임산·수유부 등 특별한 영양관리가 필요한 특정 대상을 위하여 식품과 영양성분을 배합하는 등의 방법으로 제조·가공한 조제유류·조제식·이유식·체중조절용 조제식품·임산수유부용 식품·고령자용 영양조제식품과, 정상적으로 섭취·소화·흡수 또는 대사할 수 있는 능력이 제한되거나 질병·수술 등의 임상적 상태로 인하여 일반인과 생리적으로 특별히 다른 영양요구량을 가진 사람에게 식사의 일부 또는 전부를 대신할 목적으로 경구 또는 경관급식을 통하여 공급하도록 제조·가공한 식품 중, 그린바이오 생물자원을 원료·성분으로 이용하고 생명공학 관련 기술·생물공정의 직접 기여가 함께 입증된 것을 제조하는 산업활동을 말한다.","exclude":"특별한 영양관리 대상이나 임상적 상태를 표방하더라도 그린바이오 생물자원과 생명공학 관련 기술·생물공정의 직접 기여를 입증할 수 없는 일반 조제식·환자식·고령친화식품의 제조는 제외한다. 「건강기능식품에 관한 법률」에 따른 건강기능식품의 제조와, 완제품이 아니라 다른 식품 제조에 투입되는 원료·중간소재의 제조도 제외한다."},{"code":"335","jung":"33","name":"그린바이오 대체식품 제조업","def":"농업에 실제적이거나 잠재적인 가치가 있는 미생물, 산업적으로 이용되는 곤충 또는 육상·해양 생물체와 그 세포·조직배양 산물 등 생물기원 천연물에 세포배양·정밀발효·생물전환 등 생명공학 관련 기술을 직접 적용하여 축산물 등을 대체하는 식품 완제품을 제조하는 산업활동을 말한다.","exclude":"세포배양·정밀발효·생물전환의 직접 기여가 없는 단순 식물성 원료 배합제품과, 원천 생물체가 위 관련 분야에 해당함을 확인할 수 없는 배양식품의 제조는 제외한다. 완제품을 생산하지 않고 외부 고객에게 연구·설계·개발 결과만 제공하는 활동과 식품으로 제조하지 않은 세포주 자체의 생산도 제외한다."},{"code":"339","jung":"33","name":"기타 그린바이오 식품 제조업","def":"그린바이오 생물자원을 원료·성분으로 이용하고 생명공학 관련 기술·생물공정이 제품의 특성이나 제조공정에 직접 기여하는 식용 완제품으로서, 발효식품, 건강기능식품, 특수영양·특수의료용도식품, 대체식품의 어느 것에도 해당하지 않는 것을 제조하는 산업활동을 말한다. 곤충을 원료로 한 스낵·바 등 식용 곤충 완제품이 대표적이다.","exclude":"원료가 생물유래라는 표시나 천연·친환경 표방만 있고 생명공학 관련 기술·생물공정의 직접 기여를 증빙할 수 없는 일반 가공식품의 제조는 제외한다."},{"code":"341","jung":"34","name":"동물용 백신 및 기타 예방·치료용 생물학적 제제 제조업","def":"「약사법」이 정한 의약품 중 동물용으로만 사용하는 것으로서, 생물체·세포·재조합기술 등 생명공학 관련 기술을 이용하여 동물 질병의 예방·치료 등에 사용하는 백신·항체·단백질·세포 기반 생물학적 제제를 제조하는 산업활동을 말한다.","exclude":"생명공학 관련 기술을 이용하지 않은 합성 동물용 의약품의 제조는 제외한다. 「동물용의약품등 취급규칙」이 정한 동물용의약외품의 제조도 제외한다."},{"code":"349","jung":"34","name":"기타 그린바이오 동물용 의약품 제조업","def":"「약사법」이 정한 의약품 중 동물용으로만 사용하는 것으로서, 백신 및 기타 예방·치료용 생물학적 제제에 해당하지 않는 그 밖의 바이오의약품을 제조하는 산업활동을 말한다. 진단액·진단항원 등 진단용 생물학적 제제가 대표적이다.","exclude":"생명공학 관련 기술을 이용하지 않은 합성 동물용 의약품의 제조는 제외한다. 「동물용의약품등 취급규칙」이 정한 동물용의약외품, 즉 애완용제제·동물방역용 소독제·해충 구제제·영양 보조용 비타민제 등 동물에 대한 작용이 경미하거나 직접 작용하지 않는 물품의 제조도 제외한다. 동물용 의료기기·기구·기계·장치의 제조, 수의진료와 동물의 영양·성장·사료 효용을 목적으로 하는 사료·사료첨가제 제조도 제외한다."},{"code":"391","jung":"39","name":"그린바이오 비식용 중간소재 제조업","def":"그린바이오 생물자원에 생명공학 관련 기술·생물공정을 직접 적용하여 비식용·비사료용 추출물·오일·단백질·대사산물·효소 등 중간소재를 제조하는 산업활동을 말한다.","exclude":"생명공학 관련 기술·생물공정의 직접 기여가 없는 단순 추출·분쇄, 식품 제조용 원료·중간소재, 작물재배용 제품과 생물학적 원형을 유지한 미생물·곤충·식물자원의 생산 및 범용 화이트바이오 소재 제조는 제외한다."},{"code":"392","jung":"39","name":"그린바이오 향장·생활제품 제조업","def":"인체를 청결·미화하여 매력을 더하고 용모를 밝게 변화시키거나 피부·모발의 건강을 유지·증진하기 위해 바르거나 문지르거나 뿌리는 등의 방법으로 사용되고 인체에 대한 작용이 경미한 화장품과 비의약 생활제품 중, 그린바이오 생물자원과 생명공학 관련 기술·생물공정이 제품기능이나 제조공정에 직접 기여하도록 제조하는 산업활동을 말한다.","exclude":"사람용 의약품과 동물용 의약품, 완제품이 아닌 비식용 중간소재 및 천연·생물유래 표시만 있고 그린바이오 직접성이 없는 일반 화장품·생활제품의 제조는 제외한다."},{"code":"399","jung":"39","name":"기타 그린바이오 산업용 제품 제조업","def":"그린바이오 생물자원과 식품 제조용 가공 원재료·중간생산물, 동물용 의약품의 농업적 생산·가공·활용에 직접 사용되거나 그 과정에서 산출되는 비식용·비사료용 산업용 완제품 중 달리 분류되지 않는 것으로서, 생명공학 관련 기술·생물공정이 제품기능 또는 제조공정에 직접 기여하고 농업 전후방 부가가치가 확인되는 것을 제조하는 산업활동을 말한다. 다만 작물재배용 제품, 동물용 의약품, 비식용 중간소재 및 향장·생활제품은 포함하지 않는다.","exclude":"바이오연료·범용 바이오화학 등 화이트바이오 제품, 단순 친환경 제품과 종자·농업에 실제적이거나 잠재적인 가치가 있는 미생물·산업적으로 이용되는 곤충·생물기원 천연물·식품 제조용 가공 원재료·중간생산물·동물 전용 의약품 사이의 직접 연계 또는 생명공학 관련 기술·생물공정의 직접 기여를 증명할 수 없는 잔여품목은 제외한다."},{"code":"410","jung":"41","name":"그린바이오 생물자원·제품 도매업","def":"그린바이오 생물자원·소재·제품을 구입하여 소매업자·산업사용자·기관 등에 재판매하는 산업활동을 말한다.","exclude":"그린바이오 직접성을 확인할 수 없는 일반 종자·식품·화장품·동물용 의약품의 도매, 자기가 생산·제조한 생물자원·소재·제품의 판매와 그린바이오 연구·생산용 배지·시약·분석장비·공정장비의 도매는 제외한다. 상품에 대한 소유권을 취득하지 않고 수수료·계약에 따라 매매를 알선하는 상품 중개도 제외한다."},{"code":"420","jung":"42","name":"그린바이오 생물자원·제품 소매업","def":"그린바이오 생물자원·소재·제품을 일반소비자 또는 최종 수요자에게 판매하는 산업활동을 말한다. 전문점·전자상거래를 통한 판매를 포함한다.","exclude":"그린바이오 직접성을 확인할 수 없는 일반 원예자원·애완곤충·식품·화장품의 종합소매, 자기가 생산·제조한 생물자원·소재·제품의 판매와 그린바이오 연구·생산용 배지·시약·분석장비·공정장비의 소매는 제외한다. 사업자·기관을 주된 상대로 재판매하는 활동은 도매업으로 분류한다."},{"code":"511","jung":"51","name":"그린바이 function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}
function esc(s){
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ---------------- 현황 tab ----------------
function renderStatus(){
  const root = document.getElementById('panel-status');
  const dae = DATA.dae, jung = DATA.jung, so = DATA.so;

  root.appendChild(el('div','section-title','생태계 구성 — 핵심 · 후방 · 전방 · 지원산업'));
  const byCode = new Map(dae.map(d=>[d.code,d]));
  const makeEcoCard = code=>{
    const d = byCode.get(code);
    if(!d) throw new Error('대분류 코드 누락: '+code);
    const box = el('div','eco-card');
    box.dataset.code = code;
    const role = el('div','role');
    role.textContent = d.role;
    const name = el('div','name');
    const num = el('span','eco-num');
    num.textContent = d.code+'.';
    name.appendChild(num);
    name.appendChild(document.createTextNode(d.name));
    box.appendChild(role);
    box.appendChild(name);
    return box;
  };
  const makeEcoArrow = ()=>{
    const arrow = el('div','eco-arrow','&rarr;');
    arrow.setAttribute('aria-hidden','true');
    return arrow;
  };

  const ecosystem = el('figure','ecosystem-map');
  const mainFlow = el('div','eco-main');
  mainFlow.setAttribute('aria-label','그린바이오산업 주 가치사슬');
  mainFlow.appendChild(makeEcoCard('1'));
  mainFlow.appendChild(makeEcoArrow());

  const coreGroup = el('div','eco-core-group');
  coreGroup.setAttribute('role','group');
  coreGroup.setAttribute('aria-label','핵심산업: 생물자원 생산업과 제조업');
  coreGroup.appendChild(el('div','eco-core-title','핵심산업 · 직접 생산 영역'));
  const coreFlow = el('div','eco-core-flow');
  coreFlow.appendChild(makeEcoCard('2'));
  coreFlow.appendChild(makeEcoArrow());
  coreFlow.appendChild(makeEcoCard('3'));
  coreGroup.appendChild(coreFlow);
  mainFlow.appendChild(coreGroup);

  mainFlow.appendChild(makeEcoArrow());
  mainFlow.appendChild(makeEcoCard('4'));
  ecosystem.appendChild(mainFlow);

  const supportBridge = el('div','eco-support-bridge');
  supportBridge.setAttribute('aria-hidden','true');
  for(let i=0;i<4;i++) supportBridge.appendChild(el('span','', '&uarr;'));
  ecosystem.appendChild(supportBridge);

  const supportData = byCode.get('5');
  const supportCard = el('div','eco-support-card');
  supportCard.dataset.code = '5';
  const supportIdentity = el('div','identity');
  const supportRole = el('div','role');
  supportRole.textContent = supportData.role;
  const supportName = el('div','name');
  const supportNum = el('span','eco-num');
  supportNum.textContent = supportData.code+'.';
  supportName.appendChild(supportNum);
  supportName.appendChild(document.createTextNode(supportData.name));
  supportIdentity.appendChild(supportRole);
  supportIdentity.appendChild(supportName);
  supportCard.appendChild(supportIdentity);
  ecosystem.appendChild(supportCard);

  root.appendChild(ecosystem);

  root.appendChild(el('div','section-title','대분류별 중·소분류 분포'));
  const table = el('table','dist-table');
  const thead = el('thead','', '<tr><th>대분류</th><th style="text-align:right">중분류</th><th style="text-align:right">소분류</th></tr>');
  table.appendChild(thead);
  const tbody = el('tbody');
  let tJ=0,tS=0;
  dae.forEach(d=>{
    const jList = jung.filter(j=>j.dae===d.code);
    const jCodes = jList.map(j=>j.code);
    const sList = so.filter(s=>jCodes.includes(s.jung));
    tJ+=jList.length; tS+=sList.length;
    const tr = el('tr','', '<td>'+esc(d.code)+'. '+esc(d.name)+'</td>' +
      '<td class="num">'+jList.length+'</td><td class="num">'+sList.length+'</td>');
    tbody.appendChild(tr);
  });
  tbody.appendChild(el('tr','', '<td>합계 '+dae.length+'개 대분류</td><td class="num">'+tJ+'</td><td class="num">'+tS+'</td>'));
  table.appendChild(tbody);
  root.appendChild(table);
}

  root.innerHTML = `

  <div class="law-sub">
    <p><b>「농업생명자원의 보존ㆍ관리 및 이용에 관한 법률」 제2조제1호</b> — “농업생명자원”이란 「농업ㆍ농촌 및 식품산업 기본법」 제3조제1호에 따른 농업에 실제적이거나 잠재적인 가치가 있는 동물, 식물, 미생물 등 생물체의 <b>실물(實物)</b>과 그 실물을 이용하여 파악된 유용한 사실 등의 <b>정보</b>를 말한다.</p>
    <p><b>「생명공학육성법」 제2조제1호</b> — “생명공학”이란 <b>각종 생물체의 생물학적 시스템, 생체, 유전체 또는 그들로부터 유래되는 물질ㆍ정보를 연구ㆍ활용하는 학문과 기술</b>을 말하며, <b>기초의과학(基礎醫科學)</b>을 포함한다.</p>
  </div>
  <p>2. “그린바이오산업”이란 그린바이오를 활용하여 <b>농업 및 농업 관련 전ㆍ후방 산업</b>에 부가가치를 창출하는 산업으로서, <b>관련된 재화 또는 서비스</b>를 <b>개발ㆍ생산ㆍ판매ㆍ유통</b>하는 산업을 말한다.</p>
  <ol>
    <li>가. 「종자산업법」 제2조제1호에 따른 <b>종자</b></li>
    <li>나. 「농업생명자원의 보존ㆍ관리 및 이용에 관한 법률」 제2조제1호에 따른 농업생명자원으로서의 <b>미생물</b></li>
    <li>다. 「곤충산업의 육성 및 지원에 관한 법률」 제2조제1호에 따른 <b>곤충</b></li>
    <li>라. 「천연물신약 연구개발 촉진법」 제2조제1호에 따른 <b>천연물</b></li>
    <li>마. 「식품산업진흥법」 제2조제1호의 <b>식품</b>의 제조에 사용되는 <b>원재료</b> 또는 <b>중간생산물</b>로서 분말, 액상 등 별도의 형태로 <b>가공된 것</b></li>
    <li>바. 그 밖에 대통령령으로 정하는 것</li>
  </ol>
  <div class="law-sub">
    <p><b>「그린바이오산업 육성에 관한 법률 시행령」 제2조</b> — 법 제2조제2호바목에서 “대통령령으로 정하는 것”이란 「약사법」 제2조제4호에 따른 의약품으로서 <b>동물용으로만 사용할 것을 목적으로 하는 의약품</b>을 말한다.</p>
  </div>
</figure>

<div class="section-title">분류 설계 원칙</div>
<div class="method-block"><ul>
  <li><b>생태계 구성</b> — 핵심산업(생물자원 생산·제조)에 직접 후방(기자재 공급), 직접 전방(도소매), 직접 지원(서비스)을 더한 네 부문으로 구성한다.</li>
  <li><b>계층은 3단계</b> — 대·중·소분류까지만 본체에 둔다.</li>
  <li><b>규모의 근거</b> — 통계분류포털에 게시된 산업 특수분류 37종을 전수 비교한 결과 3단계가 22종으로 가장 많고 대·중·소분류 수의 중앙값은 각각 5·14·34였다. 이를 근거로 잠정 목표범위를 대5 / 중15~20 / 소30~50으로 두었고 현재 안은 그 범위 안에 있다. 5단계 구조는 농림축산식품산업 1종뿐이라 일반 규칙으로 삼지 않았다.</li>
</ul></div>

// ---------------- 다운로드 tab ----------------
function renderDownload(){
  const root = document.getElementById('panel-download');
  const bytes = Math.round(XLSX_B64.length * 3 / 4);
  const size = bytes > 1024 ? (bytes/1024).toFixed(0)+'KB' : bytes+'B';

  root.appendChild(el('div','section-title','그린바이오산업 특수분류표 내려받기'));

  const card = el('div','dl-card');
  card.appendChild(el('h3','','제1차 그린바이오산업 특수분류(안)'));

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'dl-btn';
  btn.textContent = '엑셀 파일 다운로드 (.xlsx)';
  btn.addEventListener('click', downloadWorkbook);
  card.appendChild(btn);
  card.appendChild(el('div','dl-meta', '파일명 그린바이오산업_특수분류표.xlsx · 약 '+size));
  root.appendChild(card);
}

function downloadWorkbook(){
  if(!XLSX_B64){
    alert('엑셀 데이터가 아직 생성되지 않았습니다. build_index.py를 실행하세요.');
    return;
  }
  const bin = atob(XLSX_B64);
  const bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const blob = new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '그린바이오산업_특수분류표.xlsx';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

// ---------------- 분류표 tab ----------------
let currentLevel = 'dae'; // dae, jung, so
let showAllDefinitions = false;
let definitionCheckbox = null;

const PANELS = {
  def: {label:'정의', cls:'node-def', open:'def-open'}
};

function levelRank(l){ return {dae:0,jung:1,so:2}[l]; }

function syncPanelCheckbox(kind){
  const box = definitionCheckbox;
  if(!box) return;
  const spec = PANELS[kind];
  const nodes = [...document.querySelectorAll('#panel-table .node')]
    .filter(node=>node.querySelector(':scope > .node-detail > .'+spec.cls));
  const openCount = nodes.filter(node=>node.classList.contains(spec.open)).length;
  box.checked = nodes.length > 0 && openCount === nodes.length;
  box.indeterminate = openCount > 0 && openCount < nodes.length;
  showAllDefinitions = box.checked;
}

function createNode(level, item, children=[], initialExpanded=false){
  const {code, name, def} = item;
  const hasChildren = children.length > 0;
  const node = el('div','node node-'+level+(hasChildren ? ' has-kids' : ''));
  const row = el('div','row');
  const codeEl = el('span','code');
  codeEl.textContent = code;
  row.appendChild(codeEl);

  let nameControl;
  if(hasChildren){
    nameControl = document.createElement('button');
    nameControl.type = 'button';
    nameControl.className = 'name btn-node-name';
  }else{
    nameControl = el('span','name');
  }
  nameControl.textContent = name;
  row.appendChild(nameControl);

  const actions = el('span','row-actions');
  const detail = el('div','node-detail');
  // 정의는 토글로 여닫는다.
  const addPanel = (kind, panel, initiallyOpen)=>{
    const spec = PANELS[kind];
    panel.classList.add(spec.cls);
    panel.id = kind+'-'+level+'-'+code;
    detail.appendChild(panel);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn-def';
    btn.textContent = spec.label;
    btn.setAttribute('aria-controls', panel.id);
    const apply = opened=>{
      node.classList.toggle(spec.open, opened);
      panel.hidden = !opened;
      btn.setAttribute('aria-expanded', String(opened));
      btn.setAttribute('aria-label', code+' '+name+' '+spec.label+' '+(opened ? '접기' : '보기'));
    };
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      apply(!node.classList.contains(spec.open));
      syncPanelCheckbox(kind);
    });
    apply(initiallyOpen);
    actions.appendChild(btn);
  };

  if(def) addPanel('def', defBlock(item), showAllDefinitions);

  let toggleBtn = null;
  if(hasChildren){
    toggleBtn = document.createElement('button');
    toggleBtn.type = 'button';
    toggleBtn.className = 'btn-toggle';
    toggleBtn.appendChild(el('span','chev','▶'));
    actions.appendChild(toggleBtn);
  }
  row.appendChild(actions);

  node.appendChild(row);
  if(detail.children.length) node.appendChild(detail);

  const kids = el('div','kids');
  kids.id = 'children-'+level+'-'+code;
  kids.hidden = true;
  children.forEach(child => kids.appendChild(child));
  node.appendChild(kids);

  if(hasChildren){
    const setExpanded = expanded=>{
      node.classList.toggle('expanded', expanded);
      kids.hidden = !expanded;
      nameControl.setAttribute('aria-expanded', String(expanded));
      toggleBtn.setAttribute('aria-expanded', String(expanded));
      const action = expanded ? '접기' : '펼치기';
      nameControl.setAttribute('aria-label', code+' '+name+' 하위 분류 '+action);
      toggleBtn.setAttribute('aria-label', code+' '+name+' 하위 분류 '+action);
      toggleBtn.title = '하위 분류 '+action;
    };
    const toggleExpanded = ()=>setExpanded(!node.classList.contains('expanded'));
    nameControl.setAttribute('aria-controls', kids.id);
    toggleBtn.setAttribute('aria-controls', kids.id);
    nameControl.addEventListener('click', toggleExpanded);
    toggleBtn.addEventListener('click', toggleExpanded);
    setExpanded(initialExpanded);
  }

  return node;
}

function renderTable(){
  const root = document.getElementById('panel-table');
  root.innerHTML = '';

  const toolbar = el('div','toolbar');
  const controls = el('div','level-controls');
  controls.setAttribute('role','group');
  controls.setAttribute('aria-label','표시할 분류 층위 선택');
  const levels = [['dae','대분류'],['jung','중분류'],['so','소분류']];
  levels.forEach(([lv,label])=>{
    const b = el('button','level-key '+lv+(lv===currentLevel ? ' active':''),esc(label));
    b.type = 'button';
    b.setAttribute('aria-pressed', String(lv===currentLevel));
    b.addEventListener('click', ()=>{ currentLevel = lv; renderTable(); });
    controls.appendChild(b);
  });
  toolbar.appendChild(controls);

  const makeControl = (kind, text)=>{
    const spec = PANELS[kind];
    const wrap = el('label','definition-control');
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = showAllDefinitions;
    box.setAttribute('aria-label', '전체 '+text);
    box.addEventListener('change', ()=>{
      const on = box.checked;
      box.indeterminate = false;
      showAllDefinitions = on;
      document.querySelectorAll('#panel-table .node').forEach(node=>{
        const panel = node.querySelector(':scope > .node-detail > .'+spec.cls);
        if(!panel) return;
        const btn = node.querySelector(':scope > .row [aria-controls="'+panel.id+'"]');
        node.classList.toggle(spec.open, on);
        panel.hidden = !on;
        if(btn){
          btn.setAttribute('aria-expanded', String(on));
          btn.setAttribute('aria-label',
            (btn.getAttribute('aria-label')||'').replace(/(보기|접기)$/, on ? '접기' : '보기'));
        }
      });
    });
    wrap.appendChild(box);
    wrap.appendChild(document.createTextNode(text));
    toolbar.appendChild(wrap);
    return box;
  };

  definitionCheckbox = makeControl('def', '정의 보기');
  root.appendChild(toolbar);

  const rank = levelRank(currentLevel);
  const tree = el('div','tree');

  DATA.dae.forEach(d=>{
    const jungChildren = [];
    const jList = DATA.jung.filter(j=>j.dae===d.code);
    jList.forEach(j=>{
      const soChildren = [];
      const sList = DATA.so.filter(s=>s.jung===j.code);
      sList.forEach(s=>{
        soChildren.push(createNode('so', s));
      });
      jungChildren.push(createNode('jung', j, soChildren, rank >= 2));
    });
    tree.appendChild(createNode('dae', d, jungChildren, rank >= 1));
  });

  root.appendChild(tree);
  syncPanelCheckbox('def');
}

function defBlock(item){
  const b = el('div','def-block');
  const hasIncludeList = Array.isArray(item.include) && item.include.length > 0;

  b.appendChild(el('div','lbl', hasIncludeList ? '정의' : '정의&middot;포함'));
  b.appendChild(el('div','', esc(item.def)));

  const addList = (cls, label, value)=>{
    if(!value || (Array.isArray(value) && value.length === 0)) return;
    const sec = el('div', cls);
    sec.appendChild(el('div','lbl', label));
    if(Array.isArray(value)){
      const ul = el('ul','def-list');
      value.forEach(v=>{
        const li = document.createElement('li');
        li.textContent = v;
        ul.appendChild(li);
      });
      sec.appendChild(ul);
    }else{
      sec.appendChild(el('div','', esc(value)));
    }
    b.appendChild(sec);
  };

  addList('incl', '포함', item.include);
  addList('excl', '주요 제외&middot;이동', item.exclude);

  return b;
}

// ---------------- tabs ----------------
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
  });
});

renderStatus();
renderTable();
renderMethod();
renderDownload();
